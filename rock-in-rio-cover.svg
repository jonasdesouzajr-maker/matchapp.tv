<circle cx="246" cy="797" r="5" fill="#B8241F"/>
<text x="266" y="802" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="900" fill="#14131A" letter-spacing="1.6">LIVE NOW</text>

<text x="300" y="848" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#FFF3A3" text-anchor="middle" letter-spacing="3.5">matchapp.tv</text>
