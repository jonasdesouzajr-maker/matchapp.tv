<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0B0518"/><stop offset="38%" stop-color="#2E1259"/>
<stop offset="66%" stop-color="#6B2A7A"/><stop offset="80%" stop-color="#C4487B"/><stop offset="92%" stop-color="#F0834E"/><stop offset="100%" stop-color="#3A1230"/>
</linearGradient>
<radialGradient id="sunGlow" cx="50%" cy="76%" r="42%">
<stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.95"/><stop offset="55%" stop-color="#F0834E" stop-opacity="0.35"/><stop offset="100%" stop-color="#F0834E" stop-opacity="0"/>
</radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#E5C158" stop-opacity="0.55"/><stop offset="100%" stop-color="#E5C158" stop-opacity="0"/>
</linearGradient>
<linearGradient id="beam2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#8FD6FF" stop-opacity="0.4"/><stop offset="100%" stop-color="#8FD6FF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFF3A3"/><stop offset="50%" stop-color="#E5C158"/><stop offset="100%" stop-color="#B8862F"/>
</linearGradient>
<linearGradient id="crowdFade" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0B0518" stop-opacity="0"/><stop offset="55%" stop-color="#0B0518" stop-opacity="0.72"/><stop offset="100%" stop-color="#0B0518" stop-opacity="1"/>
</linearGradient>
</defs>

<rect width="600" height="900" fill="url(#sky)"/>
<circle cx="300" cy="640" r="285" fill="url(#sunGlow)"/>

<g opacity="0.85">
<circle cx="88" cy="96" r="1.6" fill="#fff"/><circle cx="182" cy="58" r="1.1" fill="#fff"/><circle cx="268" cy="118" r="1.5" fill="#fff"/>
<circle cx="392" cy="72" r="1.2" fill="#fff"/><circle cx="470" cy="136" r="1.7" fill="#fff"/><circle cx="524" cy="66" r="1.1" fill="#fff"/>
<circle cx="132" cy="168" r="1.2" fill="#fff"/><circle cx="342" cy="182" r="1.3" fill="#fff"/><circle cx="228" cy="42" r="1.1" fill="#fff"/>
</g>

<g opacity="0.7">
<polygon points="120,150 92,470 168,470" fill="url(#beam2)"/>
<polygon points="300,120 250,470 350,470" fill="url(#beam)"/>
<polygon points="480,150 432,470 508,470" fill="url(#beam2)"/>
</g>

<!-- Sugarloaf-inspired skyline silhouette: Rio, rendered as simple original shapes -->
<g fill="#150A2E" opacity="0.96">
<path d="M0,596 L52,548 L96,596 Z"/>
<path d="M84,600 C104,536 152,516 186,556 C206,580 210,596 212,600 Z"/>
<path d="M232,600 C250,554 286,540 306,570 C318,588 320,596 322,600 Z"/>
<path d="M338,600 C366,506 428,494 462,554 C478,582 482,594 484,600 Z"/>
<path d="M498,600 L540,552 L600,600 Z"/>
<rect x="0" y="596" width="600" height="24"/>
</g>

<!-- Stage truss + crowd -->
<g opacity="0.95">
<rect x="150" y="612" width="300" height="8" fill="#241040"/>
<rect x="150" y="620" width="10" height="52" fill="#241040"/><rect x="440" y="620" width="10" height="52" fill="#241040"/>
<circle cx="196" cy="608" r="5" fill="#E5C158" opacity="0.9"/><circle cx="264" cy="608" r="5" fill="#8FD6FF" opacity="0.85"/>
<circle cx="336" cy="608" r="5" fill="#E5C158" opacity="0.9"/><circle cx="404" cy="608" r="5" fill="#C4487B" opacity="0.85"/>
</g>
<g fill="#0B0518" opacity="0.9">
<circle cx="40" cy="686" r="15"/><circle cx="86" cy="694" r="13"/><circle cx="134" cy="684" r="16"/><circle cx="184" cy="696" r="13"/>
<circle cx="232" cy="686" r="15"/><circle cx="282" cy="696" r="14"/><circle cx="330" cy="684" r="16"/><circle cx="380" cy="694" r="13"/>
<circle cx="428" cy="686" r="15"/><circle cx="476" cy="696" r="14"/><circle cx="524" cy="684" r="16"/><circle cx="568" cy="694" r="13"/>
<rect x="0" y="694" width="600" height="60"/>
</g>
<rect x="0" y="628" width="600" height="252" fill="url(#crowdFade)"/>

<!-- Frame -->
<rect x="20" y="20" width="560" height="860" fill="none" stroke="#E5C158" stroke-width="2.5" opacity="0.9"/>
<rect x="31" y="31" width="538" height="838" fill="none" stroke="#E5C158" stroke-width="1" opacity="0.3"/>

<!-- Type -->
<text x="300" y="196" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#FFF3A3" text-anchor="middle" letter-spacing="7" opacity="0.95">RIO DE JANEIRO</text>
<line x1="196" y1="216" x2="404" y2="216" stroke="#E5C158" stroke-width="1" opacity="0.55"/>

<text x="300" y="296" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="70" font-weight="900" fill="url(#goldText)" text-anchor="middle" letter-spacing="1">ROCK</text>
<text x="300" y="356" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="300" fill="#FFF3A3" text-anchor="middle" letter-spacing="16" opacity="0.92">IN RIO</text>
<text x="300" y="452" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="82" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="4" opacity="0.97">2026</text>

<line x1="196" y1="490" x2="404" y2="490" stroke="#E5C158" stroke-width="1" opacity="0.55"/>
<text x="300" y="522" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="2">SET 4-7 &#183; 11-13</text>
<text x="300" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D8C9F0" text-anchor="middle" letter-spacing="1">CIDADE DO ROCK &#183; PARQUE OL&#205;MPICO</text>

