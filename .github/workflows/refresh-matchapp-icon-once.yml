name: Refresh MatchApp icon assets once

on:
  push:
    paths:
      - ".github/workflows/refresh-matchapp-icon-once.yml"
      - ".tmp/matchapp-icon-seed.part*"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate launcher assets from approved icon
        shell: bash
        run: |
          cat .tmp/matchapp-icon-seed.part{1,2,3,4,5,6,7} | base64 -d > /tmp/matchapp-icon-seed.webp
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path(".")
          image = Image.open("/tmp/matchapp-icon-seed.webp").convert("RGB")
          image = image.resize((512, 512), Image.Resampling.LANCZOS)

          def square(path, size):
              out = image.resize((size, size), Image.Resampling.LANCZOS)
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              out.save(path, "PNG", optimize=True)

          def round_icon(path, size):
              out = image.resize((size, size), Image.Resampling.LANCZOS).convert("RGBA")
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              out.putalpha(mask)
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              out.save(path, "PNG", optimize=True)

          square("assets/brand/matchapp-ai-install-512.png", 512)
          square("assets/brand/matchapp-ai-install-192.png", 192)
          square("assets/brand/matchapp-apple-touch-icon.png", 180)
          square("android-studio/app/src/main/res/drawable/ic_launcher_foreground.png", 512)
          square("android-studio/play/icon-512.png", 512)

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }
          for density, size in sizes.items():
              base = root / f"android-studio/app/src/main/res/mipmap-{density}"
              square(base / "ic_launcher.png", size)
              round_icon(base / "ic_launcher_round.png", size)
          PY

      - name: Commit generated icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             assets/brand/matchapp-ai-install-512.png             assets/brand/matchapp-ai-install-192.png             assets/brand/matchapp-apple-touch-icon.png             android-studio/app/src/main/res/drawable/ic_launcher_foreground.png             android-studio/play/icon-512.png             android-studio/app/src/main/res/mipmap-mdpi/ic_launcher.png             android-studio/app/src/main/res/mipmap-mdpi/ic_launcher_round.png             android-studio/app/src/main/res/mipmap-hdpi/ic_launcher.png             android-studio/app/src/main/res/mipmap-hdpi/ic_launcher_round.png             android-studio/app/src/main/res/mipmap-xhdpi/ic_launcher.png             android-studio/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png             android-studio/app/src/main/res/mipmap-xxhdpi/ic_launcher.png             android-studio/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png             android-studio/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png             android-studio/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          if git diff --cached --quiet; then
            echo "No generated icon changes to commit."
            exit 0
          fi
          git commit -m "Generate premium MatchApp launcher icon assets"
          git push origin HEAD:main
