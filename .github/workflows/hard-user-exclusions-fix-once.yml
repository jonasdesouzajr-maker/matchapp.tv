name: Hard user exclusions repair candidate
on:
  push:
    branches: [fix/match-exhaustion-20260917]
    paths:
      - '.github/workflows/hard-user-exclusions-fix-once.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch and prove candidate without red CI
        shell: bash
        run: |
          set +e
          node tools/hard-user-exclusions-fix-ci.cjs
          PATCH=$?
          npm ci --ignore-scripts
          CI=$?
          npm test
          TESTS=$?
          npm run audit:site
          AUDIT=$?
          node -e "const fs=require('fs');const a=fs.readFileSync('app.js','utf8'),h=fs.readFileSync('index.html','utf8');const ok=a.includes(\"['match_savedList','match_dislikedList']\")&&a.includes('!hardExcluded.has(policy.key(e.title))')&&h.includes('/app.js?v=202');console.log('HARD_USER_EXCLUSION_VERIFY='+ok);process.exit(ok?0:2)"
          VERIFY=$?
          echo "statuses patch=$PATCH ci=$CI tests=$TESTS audit=$AUDIT verify=$VERIFY"
          if [ "$PATCH" -eq 0 ] && [ "$CI" -eq 0 ] && [ "$TESTS" -eq 0 ] && [ "$AUDIT" -eq 0 ] && [ "$VERIFY" -eq 0 ]; then
            rm -f .github/workflows/hard-user-exclusions-fix-once.yml tools/hard-user-exclusions-fix-ci.cjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Keep saved and disliked titles out of recycled matches"
            git push origin HEAD:fix/match-exhaustion-20260917
            echo HARD_USER_EXCLUSIONS_COMMITTED=1
          else
            echo HARD_USER_EXCLUSIONS_COMMITTED=0
          fi
          exit 0
