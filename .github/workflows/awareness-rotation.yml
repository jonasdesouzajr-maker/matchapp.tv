name: Rotate awareness spotlight
on:
  schedule:
    - cron: '5 3 * * *'   # 00:05 America/Sao_Paulo while UTC-3
    - cron: '5 12 * * *'  # recovery pass if GitHub cron was delayed
  push:
    branches: [main]
    paths:
      - 'awareness/calendar.json'
      - 'tools/awareness-bot.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awareness-bot
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify official sources and rotate campaign
        run: |
          node tools/awareness-bot.mjs
          node tools/update-sitemap.js
          node --test tests/awareness-campaign.test.cjs
      - name: Publish awareness state and SEO changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matchapp-awareness-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              node tools/awareness-bot.mjs
              node tools/update-sitemap.js
              node --test tests/awareness-campaign.test.cjs
            fi
            git add awareness/current.json awareness/*/index.html tools/awareness-urls.json sitemap.xml sitemaps.xml
            if git diff --staged --quiet; then
              echo "Awareness state already current."
              exit 0
            fi
            git commit -m "Awareness bot: rotate active campaign"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
