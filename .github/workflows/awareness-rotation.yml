name: Rotate awareness spotlight
on:
  schedule:
    - cron: '45 3 * * *'  # 00:45 São Paulo recovery/official source recheck; midnight performs first pass
    - cron: '5 12 * * *'  # recovery pass if GitHub cron was delayed
  push:
    branches: [main]
    paths:
      - 'awareness/calendar.json'
      - 'tools/awareness-bot.mjs'
      - 'tools/archive-international-day.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify official sources and rotate campaign
        run: |
          node tools/archive-international-day.mjs
          node tools/awareness-bot.mjs
          node tools/update-sitemap.js
          node --test tests/awareness-campaign.test.cjs
      - name: Validate authoritative campaign output
        run: node tools/check-content-rotation.js
      - name: Publish awareness state and SEO changes
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matchapp-awareness-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              node tools/archive-international-day.mjs
              node tools/awareness-bot.mjs
              node tools/update-sitemap.js
              node --test tests/awareness-campaign.test.cjs
              node tools/check-content-rotation.js
            fi
            git add index.html awareness/current.json awareness/*/index.html tools/awareness-urls.json data/international-day-history.json sitemap.xml sitemaps.xml
            if git diff --staged --quiet; then
              echo "Awareness state already current."
              echo 'changed=0' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Awareness bot: rotate active campaign"
            if git push origin HEAD:main; then echo 'changed=1' >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          exit 1
      - name: Deploy committed awareness and index updated URLs
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml --ref main
          gh workflow run indexnow.yml --ref main
