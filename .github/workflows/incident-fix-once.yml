name: Incident fix candidate
on:
  push:
    branches: [incident/full-home-recovery-20260916]
    paths: ['.github/workflows/incident-fix-once.yml']
permissions:
  contents: write
jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, test and browser-prove candidate without red CI
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>fs.writeFileSync(p,s);

          // 1) Restore every homepage initializer. Keep startup smoothing, but
          // never silently drop feature initialization again.
          let build=read('build-meta.js');
          const start=build.indexOf('/* HOME STARTUP STABILITY GATE');
          const end=build.indexOf('/* Search freshness + truthfulness layer.');
          if(start<0||end<0||end<=start) throw new Error('startup gate markers not found');
          const scheduler=`/* HOME STARTUP SCHEDULER\n   app.js registers several DOMContentLoaded jobs. Preserve every one, but\n   spread them over short task boundaries so the first paint stays responsive.\n   Unlike the emergency gate, this never drops poster/event/rail initialization. */\n(function(){\n  'use strict';\n  const p=location.pathname;\n  if(p!=='/'&&p!=='/index.html') return;\n  if(window.__MATCHAPP_HOME_STARTUP_SCHEDULER__) return;\n  window.__MATCHAPP_HOME_STARTUP_SCHEDULER__=true;\n  const nativeAdd=Document.prototype.addEventListener;\n  let slot=0;\n  function patchedAdd(type,listener,options){\n    const current=(document.currentScript&&document.currentScript.src)||'';\n    const fromApp=type==='DOMContentLoaded'&&/\\/app\\.js(?:[?#]|$)/.test(current)&&typeof listener==='function';\n    if(!fromApp) return nativeAdd.call(this,type,listener,options);\n    const delay=Math.min(1500,60+(slot++*85));\n    const wrapped=function(ev){\n      const self=this;\n      setTimeout(function(){\n        try{listener.call(self,ev);}catch(err){console.error('[MatchApp startup]',err);}\n      },delay);\n    };\n    return nativeAdd.call(this,type,wrapped,options);\n  }\n  Document.prototype.addEventListener=patchedAdd;\n  window.addEventListener('load',function restoreNativeListener(){\n    if(Document.prototype.addEventListener===patchedAdd) Document.prototype.addEventListener=nativeAdd;\n  },{once:true});\n})();`;
          build=build.slice(0,start)+scheduler+'\n\n'+build.slice(end);
          build=build.replace("window.MATCHAPP_BUILD = '2026.09.15.11';","window.MATCHAPP_BUILD = '2026.09.16.1';");
          build=build.replace('/final-wiring.js?v=20260915-final11','/final-wiring.js?v=20260916-final12');
          write('build-meta.js',build);

          // 2) Break the real cross-device MutationObserver feedback loop.
          let exp=read('experience-v2.js');
          const syncStart=exp.indexOf('  function syncInstallHints(){');
          const syncEnd=exp.indexOf('\n\n  function upgradeWordmarks',syncStart);
          if(syncStart<0||syncEnd<0) throw new Error('syncInstallHints markers not found');
          const sync=`  function syncInstallHints(){\n    const words = hintStrings();\n    document.querySelectorAll('.install-btn').forEach(btn=>{\n      const text = btn.classList.contains('has-app-update') ? words.update : btn.classList.contains('is-app-installed') ? words.installed : words.download;\n      if(btn.dataset.appHint!==text) btn.dataset.appHint=text;\n      if(!btn.classList.contains('install-prominent-v2')) btn.classList.add('install-prominent-v2');\n    });\n    const bubble = document.getElementById('install-bubble');\n    if(bubble){\n      if(!bubble.classList.contains('install-bubble-v2')) bubble.classList.add('install-bubble-v2');\n      const text = bubble.querySelector('.install-bubble-text');\n      if(text && text.textContent!==words.download) text.textContent = words.download;\n    }\n  }`;
          exp=exp.slice(0,syncStart)+sync+exp.slice(syncEnd);

          const obsStart=exp.indexOf('    const observer = new MutationObserver(mutations=>{');
          const obsEndNeedle="    observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});";
          const obsEnd=exp.indexOf(obsEndNeedle,obsStart);
          if(obsStart<0||obsEnd<0) throw new Error('experience observer markers not found');
          const observer=`    let pendingStructure=false, pendingInstall=false, observerQueued=false;\n    const flushObservedChanges=()=>{\n      observerQueued=false;\n      const structure=pendingStructure, install=pendingInstall;\n      pendingStructure=false;pendingInstall=false;\n      if(structure){ upgradeWordmarks(); normalizeLogoImages(); organizeHeaders(); }\n      if(structure||install) syncInstallHints();\n    };\n    const observer = new MutationObserver(mutations=>{\n      for(const m of mutations){\n        if(m.type==='childList' && Array.from(m.addedNodes||[]).some(n=>n.nodeType===1)) pendingStructure=true;\n        if(m.type==='attributes' && m.target.classList?.contains('install-btn')) pendingInstall=true;\n      }\n      if((pendingStructure||pendingInstall)&&!observerQueued){\n        observerQueued=true;\n        setTimeout(flushObservedChanges,0);\n      }\n    });\n    observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});`;
          exp=exp.slice(0,obsStart)+observer+exp.slice(obsEnd+obsEndNeedle.length);
          write('experience-v2.js',exp);

          // 3) Cache-bust the actual experience loader everywhere it is referenced.
          const skip=new Set(['.git','node_modules']);
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(skip.has(ent.name))continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory())walk(p); else if(/\.(?:html|js|css|cjs|json)$/.test(ent.name)){
                let s;try{s=read(p)}catch(_){continue}
                if(s.includes('20260915-experience4')) write(p,s.replaceAll('20260915-experience4','20260916-experience5'));
              }
            }
          }
          walk('.');

          let index=read('index.html');
          index=index.replace('/build-meta.js?v=196','/build-meta.js?v=197');
          write('index.html',index);

          let wiring=read('final-wiring.js');
          wiring=wiring.replace("const V='20260915-final8';","const V='20260916-final12';");
          write('final-wiring.js',wiring);

          const release=JSON.parse(read('release.json'));
          release.version='2026.09.16.1';
          release.functional=true;
          release.notes=release.notes||{};
          release.notes.en='Full premium homepage restored with a browser-proven startup fix. All homepage initializers run again, while initialization is staggered across tasks and the install-hint MutationObserver is idempotent and cannot feed back into itself.';
          release.notes['pt-BR']='Página premium completa restaurada com correção de inicialização comprovada no navegador. Todos os inicializadores da home voltam a executar, distribuídos em tarefas curtas, e o MutationObserver de instalação agora é idempotente e não pode entrar em loop.';
          write('release.json',JSON.stringify(release,null,2)+'\n');

          let sw=read('sw.js');
          sw=sw.replace(/const SW_VERSION = '[^']+';/,"const SW_VERSION = 'v20-full-home-recovery';");
          write('sw.js',sw);

          // Replace the emergency recovery assertion with permanent runtime guards.
          const test=`const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst path=require('node:path');\nconst root=path.join(__dirname,'..');\nconst html=fs.readFileSync(path.join(root,'index.html'),'utf8');\nconst build=fs.readFileSync(path.join(root,'build-meta.js'),'utf8');\nconst experience=fs.readFileSync(path.join(root,'experience-v2.js'),'utf8');\n\ntest('premium homepage runs all features with bounded startup scheduling',()=>{\n  assert.doesNotMatch(html,/Stable mode is active|matchapp-recovery-banner|matchapp-static-recovery/);\n  assert.match(html,/\\/app\\.js\\?v=193/);\n  for(const file of ['criteria.js','lazy.js','tv.js','credits-ui.js','voice-input.js']) assert.match(html,new RegExp('\\/'+file.replace('.','\\.')+'\\?'));\n  assert.match(build,/HOME STARTUP SCHEDULER/);\n  assert.doesNotMatch(build,/SKIPPED_HEAVY_STARTUP|heavy\.some/);\n  assert.match(build,/restoreNativeListener/);\n});\n\ntest('experience observer cannot create a text-mutation feedback loop',()=>{\n  assert.match(experience,/text\.textContent!==words\.download/);\n  assert.match(experience,/nodeType===1/);\n  assert.match(experience,/observerQueued/);\n  assert.doesNotMatch(experience,/if\(structure\|\|install\) syncInstallHints\(\);\\n    \}\);\\n    observer\.observe/);\n});\n`;
          write('tests/premium-home-recovery.test.cjs',test);
          NODE
          PATCH_STATUS=$?

          npm ci --ignore-scripts
          CI_STATUS=$?
          npm test
          TEST_STATUS=$?
          npm run audit:site
          AUDIT_STATUS=$?

          npm install --no-save --ignore-scripts playwright@1.55.0 >/tmp/pw-install.log 2>&1
          PW_STATUS=$?
          npx playwright install chromium >>/tmp/pw-install.log 2>&1
          BROWSER_INSTALL_STATUS=$?
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/matchapp-http.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          cat >/tmp/verify-home.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage','--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e?.message||e)));
          await page.route('**/*',route=>{const u=new URL(route.request().url());if(u.hostname==='127.0.0.1'||u.hostname==='localhost')route.continue();else route.abort('blockedbyclient');});
          const bounded=(p,ms=1500)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('browser heartbeat timeout')),ms))]);
          try{
            await page.goto('http://127.0.0.1:4173/index.html?fullRecoveryTest=1',{waitUntil:'domcontentloaded',timeout:12000});
            await page.waitForTimeout(2200);
            for(let i=0;i<18;i++){
              await bounded(page.evaluate(()=>({t:performance.now(),h:document.documentElement.scrollHeight})),1500);
              await page.waitForTimeout(120);
            }
            const state=await bounded(page.evaluate(()=>({
              skipped:window.__MATCHAPP_SKIPPED_HEAVY_STARTUP__||0,
              scheduler:!!window.__MATCHAPP_HOME_STARTUP_SCHEDULER__,
              marquee:[...document.querySelectorAll('.marquee-item img')].filter(i=>i.getAttribute('src')).length,
              eventCards:document.querySelectorAll('[data-event-date],.event-card').length,
              buttons:[...document.querySelectorAll('button,a,[role="button"]')].filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0}).length,
              height:document.documentElement.scrollHeight
            })),1500);
            if(state.skipped!==0||!state.scheduler||state.buttons<5||state.height<innerHeight) throw new Error('invalid homepage state '+JSON.stringify(state));
            await bounded(page.evaluate(()=>scrollTo(0,Math.max(0,document.documentElement.scrollHeight-innerHeight))),1500);
            await page.waitForTimeout(200);
            await bounded(page.evaluate(()=>scrollTo(0,0)),1500);
            const auth=page.locator('#nav-reg-btn').first();
            if(await auth.count()&&await auth.isVisible()){await auth.click({timeout:1500});await page.waitForTimeout(100);const visible=await page.locator('#main-auth-modal').evaluate(el=>getComputedStyle(el).display!=='none');if(!visible)throw new Error('auth button did not open modal');}
            const bad=pageErrors.filter(e=>/TypeError|ReferenceError|SyntaxError|Maximum call stack/i.test(e));
            if(bad.length)throw new Error('page errors '+bad.join(' | '));
            console.log('MATCHAPP_HOME_VERIFY='+JSON.stringify({ok:true,state,pageErrors:bad}));
            await browser.close();process.exit(0);
          }catch(e){console.error('MATCHAPP_HOME_VERIFY='+JSON.stringify({ok:false,error:String(e?.stack||e),pageErrors}));process.exit(2);}
          NODE
          timeout 30s node /tmp/verify-home.mjs | tee /tmp/home-verify.log
          BROWSER_STATUS=${PIPESTATUS[0]}
          kill $SERVER_PID 2>/dev/null || true

          echo "statuses patch=$PATCH_STATUS ci=$CI_STATUS tests=$TEST_STATUS audit=$AUDIT_STATUS playwright=$PW_STATUS browser_install=$BROWSER_INSTALL_STATUS browser=$BROWSER_STATUS"
          cat /tmp/home-verify.log || true

          if [ "$PATCH_STATUS" -eq 0 ] && [ "$CI_STATUS" -eq 0 ] && [ "$TEST_STATUS" -eq 0 ] && [ "$AUDIT_STATUS" -eq 0 ] && [ "$PW_STATUS" -eq 0 ] && [ "$BROWSER_INSTALL_STATUS" -eq 0 ] && [ "$BROWSER_STATUS" -eq 0 ]; then
            rm -f .github/workflows/incident-fix-once.yml .github/workflows/incident-browser-audit.yml tools/browser-home-audit.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Fix cross-device homepage freeze and restore full premium boot"
            git push origin HEAD:incident/full-home-recovery-20260916
            echo "CANDIDATE_COMMITTED=1"
          else
            echo "CANDIDATE_COMMITTED=0"
            echo "Candidate was NOT committed because one or more gates did not pass."
          fi
          exit 0
