name: Validate website
on:
  push:
    branches: [main, fix/stability-premium-ui, fix/content-bot-retry]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify immutable AdSense contract
        run: node --test --test-isolation=none tests/adsense-lock.test.cjs
      - run: npm ci --ignore-scripts
      - name: Verify release/build metadata match
        run: |
          VERSION="$(node -p "require('./release.json').version")"
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" build-meta.js
      - run: node tools/build-kids-pages.js
      - run: node tools/update-sitemap.js
      - name: Verify locked editorial rotation and content parity
        run: node tools/check-content-rotation.js
      - run: npm test
      - run: npm run audit:site
