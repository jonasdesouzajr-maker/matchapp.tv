name: Validate media enhancement staging
on:
  push:
    branches: [feature/media-metadata-pipeline]
permissions:
  contents: read
concurrency:
  group: media-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax check new runtime and sync code
        run: |
          node --check media-enhancements.js
          node --check tools/sync-catalog-media.js
      - run: npm test
      - run: npm run audit:site
