name: Premium homepage recovery one-shot
on:
  push:
    branches: [premium-recovery-20260915]
    paths:
      - '.github/workflows/premium-recovery-once.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore premium homepage and add startup stability gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=e4a7cf45be9396a93c1061578a974542f0f4561e
          git checkout "$BASE" -- index.html build-meta.js tests/ads.test.cjs tests/auth-updates.test.cjs
          rm -f tests/emergency-home-safe-boot.test.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const write=(p,s)=>fs.writeFileSync(p,s);

          let html=read('index.html');
          html=html.replace('/build-meta.js?v=194','/build-meta.js?v=196');
          html=html.replace('/app.js?v=192','/app.js?v=193');
          if(html.includes('matchapp-recovery-banner')||html.includes('matchapp-static-recovery')) throw new Error('static recovery residue remains');
          write('index.html',html);

          let build=read('build-meta.js');
          build=build.replace("window.MATCHAPP_BUILD = '2026.09.15.8';","window.MATCHAPP_BUILD = '2026.09.15.11';");
          build=build.replace('/final-wiring.js?v=20260915-final8','/final-wiring.js?v=20260915-final11');
          const gate=`\n/* HOME STARTUP STABILITY GATE\n   app.js historically registers many DOMContentLoaded jobs. Running all of them\n   in one event turn can monopolize the browser main thread on long home pages.\n   On the homepage only, keep user-facing functionality loaded while suppressing\n   the known automatic heavy jobs and staggering the remaining app.js startup\n   handlers. Other pages and other scripts keep native event behavior. */\n(function(){\n  'use strict';\n  const p=location.pathname;\n  if(p!=='/'&&p!=='/index.html') return;\n  if(window.__MATCHAPP_HOME_STARTUP_GATE__) return;\n  window.__MATCHAPP_HOME_STARTUP_GATE__=true;\n  const nativeAdd=Document.prototype.addEventListener;\n  let slot=0;\n  const heavy=[\n    /hydrateMarqueeCovers/,\n    /refreshEventStates/,\n    /initRail\\(['\"]marquee-viewport/,\n    /initRail\\(['\"]events-viewport/,\n    /initLiveStrip/,\n    /hydrateSpotlightPoster/,\n    /renderSpotlightCountdown/\n  ];\n  Document.prototype.addEventListener=function(type,listener,options){\n    const current=(document.currentScript&&document.currentScript.src)||'';\n    const fromApp=type==='DOMContentLoaded'&&/\\/app\\.js(?:[?#]|$)/.test(current)&&typeof listener==='function';\n    if(!fromApp) return nativeAdd.call(this,type,listener,options);\n    let source='';\n    try{source=Function.prototype.toString.call(listener);}catch(_){source='';}\n    if(heavy.some(re=>re.test(source))){\n      window.__MATCHAPP_SKIPPED_HEAVY_STARTUP__=(window.__MATCHAPP_SKIPPED_HEAVY_STARTUP__||0)+1;\n      return;\n    }\n    const delay=Math.min(1200,80+(slot++*70));\n    const wrapped=function(ev){\n      const self=this;\n      setTimeout(function(){\n        try{listener.call(self,ev);}catch(err){console.error('[MatchApp startup]',err);}\n      },delay);\n    };\n    return nativeAdd.call(this,type,wrapped,options);\n  };\n})();\n`;
          const marker='/* Search freshness + truthfulness layer.';
          if(!build.includes('HOME STARTUP STABILITY GATE')) build=build.replace(marker,gate+'\n'+marker);
          write('build-meta.js',build);

          const release=JSON.parse(read('release.json'));
          release.version='2026.09.15.11';
          release.functional=true;
          release.notes=release.notes||{};
          release.notes.en='Premium homepage restored with the full MatchApp feature stack. A homepage-only startup stability gate suppresses known automatic heavy jobs and staggers remaining app initialization so matching, auth, filters, Lazy Mode, TV mode, credits, voice, themes, ads and analytics can remain live without the previous startup lockup.';
          release.notes['pt-BR']='Página inicial premium restaurada com o conjunto completo de recursos do MatchApp. Um controle de estabilidade exclusivo da home bloqueia tarefas automáticas pesadas conhecidas e escalona a inicialização restante para manter matching, autenticação, filtros, Lazy Mode, modo TV, créditos, voz, temas, anúncios e analytics ativos sem o travamento anterior.';
          write('release.json',JSON.stringify(release,null,2)+'\n');

          let sw=read('sw.js');
          sw=sw.replace(/const SW_VERSION = '[^']+';/,"const SW_VERSION = 'v19-premium-home-recovery';");
          write('sw.js',sw);

          const test=`const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst path=require('node:path');\nconst root=path.join(__dirname,'..');\nconst html=fs.readFileSync(path.join(root,'index.html'),'utf8');\nconst build=fs.readFileSync(path.join(root,'build-meta.js'),'utf8');\n\ntest('premium homepage is live without static recovery mode',()=>{\n  assert.doesNotMatch(html,/Stable mode is active|matchapp-recovery-banner|matchapp-static-recovery/);\n  assert.match(html,/\\/app\\.js\\?v=193/);\n  for(const file of ['criteria.js','lazy.js','tv.js','credits-ui.js','voice-input.js']) assert.match(html,new RegExp('\\/'+file.replace('.','\\.')+'\\?'));\n  assert.match(html,/GTM-M7J3NNBN/);\n  assert.match(html,/ca-pub-9541435081010948/);\n});\n\ntest('homepage startup gate targets only app.js DOMContentLoaded work',()=>{\n  assert.match(build,/HOME STARTUP STABILITY GATE/);\n  assert.match(build,/document\\.currentScript/);\n  assert.match(build,/app\\\\.js/);\n  assert.match(build,/hydrateMarqueeCovers/);\n  assert.match(build,/initLiveStrip/);\n  assert.match(build,/slot\\+\\+/);\n});\n`;
          write('tests/premium-home-recovery.test.cjs',test);
          NODE
      - name: Validate recovery before publishing branch
        run: |
          npm ci --ignore-scripts
          npm test
          npm run audit:site
      - name: Commit tested recovery and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/premium-recovery-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore premium homepage with startup stability gate"
          git push origin HEAD:premium-recovery-20260915
