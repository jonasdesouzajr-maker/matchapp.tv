name: Emergency homepage safe boot
on:
  push:
    branches: [main]
    paths:
      - tools/emergency-home-safe-boot.js
permissions:
  contents: write
concurrency:
  group: matchapp-emergency-home-safe-boot
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/emergency-home-safe-boot.js
      - name: Commit emergency homepage safe boot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Emergency homepage safe boot"
          git push
