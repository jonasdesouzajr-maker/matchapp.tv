name: Refresh Catalog Media

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and validate without writing Supabase'
        required: false
        default: 'false'
  push:
    branches:
      - 'staging/tmdb-freshness-previews-20260917'
    paths:
      - 'tools/refresh-catalog-media.js'
      - 'catalog-media.js'
      - 'catalog-media.css'
      - 'tmdb.js'
      - 'supabase/functions/catalog-media-ingest/**'
      - 'supabase/config.toml'
      - '.github/workflows/scraper.yml'
      - 'tests/catalog-media-enhancements.test.cjs'

permissions:
  contents: read
  id-token: write

env:
  SUPABASE_URL: https://zkymvqrmbabngsqblyye.supabase.co

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate existing site first
        run: npm test

      - name: Verify TMDB source credential
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Missing TMDB_READ_TOKEN or TMDB_API_KEY GitHub Actions secret."
            exit 1
          fi

      - name: Acquire short-lived GitHub OIDC token
        shell: bash
        run: |
          OIDC_TOKEN="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=matchapp-supabase-catalog-media" \
            | node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(j.value||'')")"
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub did not issue an OIDC token."
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          echo "GITHUB_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Refresh media cache
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # All non-main executions are forced to dry-run so staging cannot mutate production.
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node tools/refresh-catalog-media.js --dry-run
          else
            node tools/refresh-catalog-media.js
          fi

      - name: Validate generated report
        run: node -e "const r=require('./data/catalog-media-report.json'); if(!r.rows || r.withPoster<1) process.exit(1); console.log('validated',r.rows,'rows')"

      - name: Upload refresh report
        uses: actions/upload-artifact@v4
        with:
          name: catalog-media-report-${{ github.run_id }}
          path: data/catalog-media-report.json
          retention-days: 14

      - name: Final site audit
        run: npm run audit:site
