name: Canonical audit once
on:
  push:
    branches: [seo/canonical-audit-20260917]
    paths: ['.github/workflows/canonical-audit-once.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit canonical clusters and crawl signals
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const {JSDOM}=require('jsdom');
          const root=process.cwd();
          const skip=new Set(['node_modules','.git','vendor']);
          function walk(d,out=[]){for(const e of fs.readdirSync(d,{withFileTypes:true})){if(skip.has(e.name))continue;const p=path.join(d,e.name);if(e.isDirectory())walk(p,out);else if(e.name.endsWith('.html'))out.push(p);}return out;}
          const files=walk(root).map(p=>path.relative(root,p).replaceAll('\\','/')).sort();
          const sitemapText=fs.readFileSync('sitemap.xml','utf8');
          const sm=new JSDOM(sitemapText,{contentType:'text/xml'}).window.document;
          const sitemap=new Set([...sm.querySelectorAll('loc')].map(n=>n.textContent.trim()));
          function ownUrl(f){if(f==='index.html')return 'https://matchapp.tv/';if(f.endsWith('/index.html'))return 'https://matchapp.tv/'+f.slice(0,-'index.html'.length);return 'https://matchapp.tv/'+f;}
          const rows=[];
          const canonMap=new Map(),hashMap=new Map();
          for(const f of files){let html;try{html=fs.readFileSync(f,'utf8')}catch{continue};let d;try{d=new JSDOM(html).window.document}catch{continue};const robots=(d.querySelector('meta[name="robots"]')?.content||'').toLowerCase();const noindex=robots.includes('noindex');const canonical=d.querySelector('link[rel="canonical"]')?.href||'';const og=d.querySelector('meta[property="og:url"]')?.content||'';const refresh=d.querySelector('meta[http-equiv="refresh" i]')?.content||'';const own=ownUrl(f);const inMap=sitemap.has(own);const canonInMap=sitemap.has(canonical);const copy=d.body?.cloneNode(true);copy?.querySelectorAll('script,style,noscript,template').forEach(n=>n.remove());const text=(copy?.textContent||'').replace(/\s+/g,' ').trim();const hash=crypto.createHash('sha1').update(text).digest('hex');const row={f,own,noindex,canonical,og,refresh,inMap,canonInMap,title:d.title,textLen:text.length,hash};rows.push(row);if(!noindex&&canonical){if(!canonMap.has(canonical))canonMap.set(canonical,[]);canonMap.get(canonical).push(f);}if(!noindex&&text.length>250){if(!hashMap.has(hash))hashMap.set(hash,[]);hashMap.get(hash).push(f);}}
          const canonicalClusters=[...canonMap].filter(([,v])=>v.length>1).map(([canonical,files])=>({canonical,files}));
          const exactContentDupes=[...hashMap].filter(([,v])=>v.length>1).map(([hash,files])=>({hash,files}));
          const indexableNonSelf=rows.filter(r=>!r.noindex&&r.canonical&&r.canonical!==r.own).map(r=>({file:r.f,own:r.own,canonical:r.canonical,inSitemap:r.inMap,canonicalInSitemap:r.canonInMap,title:r.title}));
          const indexableNoCanonical=rows.filter(r=>!r.noindex&&!r.canonical).map(r=>r.f);
          const indexableOutsideSitemap=rows.filter(r=>!r.noindex&&!r.inMap).map(r=>({file:r.f,own:r.own,canonical:r.canonical,title:r.title,textLen:r.textLen,refresh:r.refresh}));
          const sitemapCanonicalMissing=rows.filter(r=>r.inMap&&r.canonical!==r.own).map(r=>({file:r.f,own:r.own,canonical:r.canonical}));
          const ogMismatch=rows.filter(r=>!r.noindex&&r.og&&r.canonical&&r.og!==r.canonical).map(r=>({file:r.f,canonical:r.canonical,og:r.og}));
          const indexHtmlLinks=[];for(const r of rows){let d;try{d=new JSDOM(fs.readFileSync(r.f,'utf8')).window.document}catch{continue};for(const a of d.querySelectorAll('a[href]')){const h=a.getAttribute('href')||'';if(/(?:^|\/)index\.html(?:[?#]|$)/.test(h)||h==='/pricing/'||h==='/profile/'||h==='/register.html')indexHtmlLinks.push({file:r.f,href:h,text:(a.textContent||'').trim().slice(0,80)});}}
          console.log('=== COUNTS ===');console.log(JSON.stringify({html:rows.length,sitemap:sitemap.size,indexable:rows.filter(r=>!r.noindex).length,noindex:rows.filter(r=>r.noindex).length},null,2));
          console.log('=== INDEXABLE NON-SELF CANONICALS ===');console.log(JSON.stringify(indexableNonSelf,null,2));
          console.log('=== MULTIPLE INDEXABLE FILES CLAIM SAME CANONICAL ===');console.log(JSON.stringify(canonicalClusters,null,2));
          console.log('=== EXACT VISIBLE-CONTENT DUPLICATES ===');console.log(JSON.stringify(exactContentDupes,null,2));
          console.log('=== INDEXABLE HTML OUTSIDE SITEMAP ===');console.log(JSON.stringify(indexableOutsideSitemap,null,2));
          console.log('=== INDEXABLE MISSING CANONICAL ===');console.log(JSON.stringify(indexableNoCanonical,null,2));
          console.log('=== SITEMAP SELF-CANONICAL MISMATCH ===');console.log(JSON.stringify(sitemapCanonicalMissing,null,2));
          console.log('=== OG URL MISMATCH ===');console.log(JSON.stringify(ogMismatch,null,2));
          console.log('=== INTERNAL LINKS TO DUPLICATE/ALIAS URL FORMS ===');console.log(JSON.stringify(indexHtmlLinks,null,2));
          NODE
