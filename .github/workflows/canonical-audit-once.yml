name: Canonical audit once
on:
  push:
    branches: [seo/canonical-indexing-urgent-20260917]
    paths: ['.github/workflows/canonical-audit-once.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit canonical and duplicate URL signals
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const root=process.cwd();
          const files=[];
          function walk(dir){for(const ent of fs.readdirSync(dir,{withFileTypes:true})){if(['.git','node_modules'].includes(ent.name))continue;const p=path.join(dir,ent.name);if(ent.isDirectory())walk(p);else if(/\.html$/i.test(ent.name))files.push(p);}}
          walk(root);
          const origin='https://matchapp.tv';
          function served(file){let rel=path.relative(root,file).replace(/\\/g,'/');if(rel==='index.html')return '/';if(rel.endsWith('/index.html'))return '/'+rel.slice(0,-10);return '/'+rel;}
          const rows=[];
          const canonMap=new Map();
          const hashMap=new Map();
          const indexHtmlRefs=[];
          for(const file of files){const html=fs.readFileSync(file,'utf8');const url=served(file);const cm=html.match(/<link\s+[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)/i)||html.match(/<link\s+[^>]*href=["']([^"']+)["'][^>]*rel=["']canonical["']/i);const canonical=cm?.[1]||'';const rm=html.match(/<meta\s+[^>]*name=["']robots["'][^>]*content=["']([^"']+)/i)||html.match(/<meta\s+[^>]*content=["']([^"']+)["'][^>]*name=["']robots["']/i);const robots=(rm?.[1]||'').toLowerCase();const noindex=robots.includes('noindex');const self=canonical===origin+url;const rel=path.relative(root,file).replace(/\\/g,'/');
            if(canonical){if(!canonMap.has(canonical))canonMap.set(canonical,[]);canonMap.get(canonical).push({rel,url,noindex});}
            if(!noindex){const text=html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().toLowerCase();const h=crypto.createHash('sha256').update(text).digest('hex');if(!hashMap.has(h))hashMap.set(h,[]);hashMap.get(h).push(rel);}
            const refs=[...html.matchAll(/(?:href|action)=["']([^"']*\/index\.html(?:[?#][^"']*)?)["']/gi)].map(m=>m[1]);if(refs.length)indexHtmlRefs.push({rel,refs:[...new Set(refs)]});
            rows.push({rel,url,canonical,noindex,self});
          }
          const sitemap=fs.readFileSync('sitemap.xml','utf8');const sm=[...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          const byServed=new Map(rows.map(r=>[origin+r.url,r]));
          const sitemapProblems=sm.map(u=>({u,row:byServed.get(u)})).filter(x=>!x.row||x.row.noindex||x.row.canonical&&x.row.canonical!==x.u);
          console.log('=== INDEXABLE NON-SELF CANONICALS ===');console.log(rows.filter(r=>!r.noindex&&r.canonical&&!r.self));
          console.log('=== CANONICAL TARGETS USED BY MULTIPLE FILES ===');console.log([...canonMap].filter(([,v])=>v.length>1).map(([k,v])=>({canonical:k,files:v})));
          console.log('=== EXACT-TEXT DUPLICATES AMONG INDEXABLE HTML ===');console.log([...hashMap.values()].filter(v=>v.length>1));
          console.log('=== INTERNAL /index.html REFERENCES ===');console.log(indexHtmlRefs);
          console.log('=== SITEMAP CANONICAL PROBLEMS ===');console.log(sitemapProblems);
          console.log('SUMMARY',JSON.stringify({html:rows.length,indexableNonSelf:rows.filter(r=>!r.noindex&&r.canonical&&!r.self).length,multiCanonical:[...canonMap.values()].filter(v=>v.length>1).length,exactTextDupes:[...hashMap.values()].filter(v=>v.length>1).length,indexHtmlRefFiles:indexHtmlRefs.length,sitemapProblems:sitemapProblems.length}));
          NODE
