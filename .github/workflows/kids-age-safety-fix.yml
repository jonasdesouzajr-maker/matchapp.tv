name: Kids age-band safety fix
on:
  push:
    branches: [matchapp-redesign-kids-mode]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[age safety applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: matchapp-redesign-kids-mode
      - name: Enforce selected age band
        shell: python
        run: |
          from pathlib import Path
          p=Path('kids/kids.js')
          s=p.read_text(encoding='utf-8')
          old="function allowedForAge(item, age) { return item.ages.includes('all') || item.ages.includes(age); }"
          new="function allowedForAge(item, age) { return age === 'all' ? item.ages.includes('all') : item.ages.includes(age); }"
          if old not in s: raise SystemExit('age-band target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Validate
        run: node --check kids/kids.js
      - name: Commit
        run: |
          git config user.name "matchapp-upgrade-bot"
          git config user.email "actions@users.noreply.github.com"
          git add kids/kids.js
          git commit -m "Tighten Kids Mode age-band enforcement [age safety applied]"
          git push origin HEAD:matchapp-redesign-kids-mode
