name: Fix MatchApp PWA icon alpha once

on:
  push:
    paths:
      - ".github/workflows/fix-matchapp-pwa-icon-alpha-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Apply transparent rounded app-icon corners
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          src=Path("assets/brand/matchapp-ai-install-512.png")
          base=Image.open(src).convert("RGBA")

          def save_icon(path,size):
              im=base.resize((size,size),Image.Resampling.LANCZOS)
              mask=Image.new("L",(size,size),0)
              radius=round(size*0.18)
              ImageDraw.Draw(mask).rounded_rectangle((0,0,size-1,size-1),radius=radius,fill=255)
              im.putalpha(mask)
              im.save(path,"PNG",optimize=True)

          save_icon("assets/brand/matchapp-ai-install-512.png",512)
          save_icon("assets/brand/matchapp-ai-install-192.png",192)
          PY
      - name: Commit transparent PWA icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand/matchapp-ai-install-512.png assets/brand/matchapp-ai-install-192.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish premium MatchApp PWA icon transparency"
          git push origin HEAD:main
