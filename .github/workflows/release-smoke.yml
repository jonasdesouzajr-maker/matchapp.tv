name: Live MatchApp Browser and Android Emulator Smoke
on:
  push:
    branches: [main]
    paths:
      - 'tools/live-production-smoke.cjs'
      - 'tools/android-emulator-smoke.sh'
      - '.github/workflows/release-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned browser test runtime without changing the repository
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait for exactly this commit to reach the live domain before testing
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in {1..28}; do
            remote="$(curl -fsSL https://matchapp.tv/deployment-sha.txt || true)"
            if [ "$remote" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Production did not confirm this commit within seven minutes."
          exit 1
      - name: Run live production browser, one real movie match and two Ask AI questions
        run: node tools/live-production-smoke.cjs
      - name: Keep screenshots and machine-readable test report, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatchApp-live-browser-screenshots
          path: artifacts/live-smoke/
          if-no-files-found: warn
          retention-days: 14
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build production-code adult and regression Kids debug APKs
        working-directory: android-studio
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :kidsapp:assembleDebug --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Pixel Android emulator and verify native adult and Kids route
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 500
          script: bash tools/android-emulator-smoke.sh
      - name: Export Android emulator images, UI hierarchy and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatchApp-Android-emulator-evidence
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 14
