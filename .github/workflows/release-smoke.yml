name: Live MatchApp Browser and Android Emulator Smoke
on:
  # The exact production deploy (not an earlier push) is the source of truth.
  # Automated Kids SEO/metadata commits can supersede a push while deploying;
  # old push-triggered smoke waited forever for a SHA that was never published.
  workflow_run:
    workflows: ["Deploy MatchApp Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live-browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned browser test runtime without changing the repository
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait for this commit or a newer descendant to reach the live domain before testing
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=64 origin main
          for i in {1..28}; do
            remote="$(curl -fsSL "https://matchapp.tv/deployment-sha.txt?release=${EXPECTED_SHA}-${i}" || true)"
            if [ "$remote" = "$EXPECTED_SHA" ]; then exit 0; fi
            if [[ "$remote" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$remote^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$EXPECTED_SHA" "$remote"; then
                echo "::notice::Expected deploy was superseded by descendant $remote; testing current production instead."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Production did not confirm this commit or a newer descendant within seven minutes."
          exit 1
      - name: Run live production adult normal matching, e-book/magazine, original art and two Ask AI questions
        run: node tools/live-production-smoke.cjs
      - name: Keep screenshots and machine-readable test report, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatchApp-live-browser-screenshots
          path: artifacts/live-smoke/
          if-no-files-found: warn
          retention-days: 14
  android-emulator:
    # The hosted guest may have no external route. Each app therefore receives
    # its own fresh emulator and a DEBUG-only adb-reverse mirror of the exact
    # checked-out web tree; production/release builds remain HTTPS-only.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, '[android-emulator-check]'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: adult
            gradle_task: ':app:assembleDebug'
          - target: kids
            gradle_task: ':kidsapp:assembleDebug'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build selected native debug APK
        working-directory: android-studio
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.gradle_task }} --no-daemon
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Pixel Android emulator and verify native adult and Kids route
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 500
          script: MATCHAPP_ANDROID_SMOKE_TARGET="${{ matrix.target }}" bash tools/android-emulator-smoke.sh
      - name: Export Android emulator images, activity state and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatchApp-Android-emulator-evidence-${{ matrix.target }}
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 14
