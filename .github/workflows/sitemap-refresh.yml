name: Refresh sitemap
on:
  push:
    branches: [main]
    paths:
      - release.json
permissions:
  contents: write
concurrency:
  group: matchapp-sitemap-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/update-sitemap.js
      - name: Commit refreshed sitemap
        run: |
          if git diff --quiet -- sitemap.xml sitemaps.xml; then
            echo "Sitemap already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemaps.xml
          git commit -m "Refresh sitemap for current release"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
