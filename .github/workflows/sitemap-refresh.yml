name: Refresh sitemap
on:
  push:
    branches: [main]
    paths:
      - release.json
permissions:
  contents: write
  actions: write
concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node tools/update-sitemap.js
      - name: Commit refreshed sitemap with retry
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              git clean -fd
              node tools/update-sitemap.js
            fi
            git add sitemap.xml sitemaps.xml
            if git diff --staged --quiet; then
              echo "Sitemap already current"
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Refresh sitemap for current release" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

      - name: Validate and deploy bot-published main commit
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
