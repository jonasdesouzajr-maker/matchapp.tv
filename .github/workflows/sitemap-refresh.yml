name: Refresh sitemap
on:
  push:
    branches: [main]
    paths:
      - tools/patch-favicon-only.js
permissions:
  contents: write
concurrency:
  group: matchapp-sitemap-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/patch-favicon-only.js
      - name: Commit only missing favicon links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --staged --quiet; then
            echo "Favicons already complete"
            exit 0
          fi
          git commit -m "Add missing browser favicon links"
          git push
