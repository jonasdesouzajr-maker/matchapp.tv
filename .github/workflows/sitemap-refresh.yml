name: Refresh sitemap
on:
  push:
    branches: [main]
    paths:
      - tools/scope-kids-gtm.js
permissions:
  contents: write
concurrency:
  group: matchapp-sitemap-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/scope-kids-gtm.js
      - name: Commit generator scope fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build-kids-pages.js
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Scope Kids GTM generation to title pages"
          git push
