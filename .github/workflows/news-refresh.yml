name: Refresh entertainment news

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-refresh.yml'
      - 'tools/refresh-news-rss.js'
      - 'tools/update-sitemap.js'
      - 'latest-news.js'

permissions:
  contents: write

concurrency:
  group: matchapp-entertainment-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch trusted entertainment headlines
        run: node tools/refresh-news-rss.js
      - name: Refresh sitemap
        run: node tools/update-sitemap.js
      - name: Commit refreshed news
        run: |
          if git diff --quiet -- news tools/news-urls.json tools/news-sitemap-meta.json sitemap.xml; then
            echo "Entertainment news already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news tools/news-urls.json tools/news-sitemap-meta.json sitemap.xml
          git commit -m "Refresh hourly entertainment news"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
