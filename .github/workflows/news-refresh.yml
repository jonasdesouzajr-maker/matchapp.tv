name: Refresh entertainment news

on:
  schedule:
    - cron: '37 * * * *' # After the 00:00 São Paulo full rotation; keep hourly news independent
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-refresh.yml'
      - 'tools/refresh-news-rss.js'
      - 'tools/update-sitemap.js'
      - 'latest-news.js'

permissions:
  contents: write
  actions: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Fetch trusted entertainment headlines
        run: node tools/refresh-news-rss.js
      - name: Refresh sitemap
        run: node tools/update-sitemap.js
      - name: Commit refreshed news with retry
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              git clean -fd
              node tools/refresh-news-rss.js
              node tools/update-sitemap.js
            fi
            git add news tools/news-urls.json tools/news-sitemap-meta.json sitemap.xml sitemaps.xml
            if git diff --staged --quiet; then
              echo "Entertainment news already current"
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Refresh hourly entertainment news" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Deploy refreshed content
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
