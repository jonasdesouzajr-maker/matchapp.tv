name: Product schema image fix
on:
  push:
    branches: [seo/product-image-fix-20260917]
    paths: ['.github/workflows/product-schema-fix-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add required Product image and commit only when green
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs=require('fs');
          const path='pricing/pricing.html';
          let html=fs.readFileSync(path,'utf8');
          let changed=false;
          html=html.replace(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g,(whole,raw)=>{
            let data;
            try{data=JSON.parse(raw);}catch{return whole;}
            if(data && data['@type']==='Product' && data.name==='MatchApp VIP'){
              data.image=['https://matchapp.tv/logo.jpeg'];
              changed=true;
              return '<script type="application/ld+json">'+JSON.stringify(data)+'</script>';
            }
            return whole;
          });
          if(!changed) throw new Error('MatchApp VIP Product JSON-LD not found');
          fs.writeFileSync(path,html);
          fs.writeFileSync('tests/product-schema.test.cjs',`const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst html=fs.readFileSync('pricing/pricing.html','utf8');\nconst scripts=[...html.matchAll(/<script type="application\\/ld\\+json">([\\s\\S]*?)<\\/script>/g)].map(m=>{try{return JSON.parse(m[1])}catch{return null}}).filter(Boolean);\nconst product=scripts.find(x=>x['@type']==='Product'&&x.name==='MatchApp VIP');\ntest('MatchApp VIP merchant Product includes the required crawlable image',()=>{\n assert(product,'MatchApp VIP Product JSON-LD must exist');\n assert.deepEqual(product.image,['https://matchapp.tv/logo.jpeg']);\n assert.equal(product.url,'https://matchapp.tv/pricing/pricing.html');\n assert(Array.isArray(product.offers)&&product.offers.length>=1);\n for(const offer of product.offers){assert.equal(offer['@type'],'Offer');assert.equal(offer.url,'https://matchapp.tv/pricing/pricing.html');}\n});\n`);
          NODE
          PATCH=$?
          npm ci --ignore-scripts
          CI=$?
          npm test
          TESTS=$?
          npm run audit:site
          AUDIT=$?
          curl -fsSI https://matchapp.tv/logo.jpeg | tee /tmp/image-head.txt
          IMAGE=$?
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('pricing/pricing.html','utf8');
          const scripts=[...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)].map(m=>{try{return JSON.parse(m[1])}catch{return null}}).filter(Boolean);
          const product=scripts.find(x=>x['@type']==='Product'&&x.name==='MatchApp VIP');
          const report={productFound:!!product,image:product?.image,offers:product?.offers?.length||0,canonical:product?.url};
          console.log('PRODUCT_SCHEMA_VERIFY',JSON.stringify(report));
          if(!product||!Array.isArray(product.image)||product.image[0]!=='https://matchapp.tv/logo.jpeg'||product.url!=='https://matchapp.tv/pricing/pricing.html')process.exit(2);
          NODE
          VERIFY=$?
          echo "statuses patch=$PATCH ci=$CI tests=$TESTS audit=$AUDIT image=$IMAGE verify=$VERIFY"
          if [ "$PATCH" -eq 0 ] && [ "$CI" -eq 0 ] && [ "$TESTS" -eq 0 ] && [ "$AUDIT" -eq 0 ] && [ "$IMAGE" -eq 0 ] && [ "$VERIFY" -eq 0 ]; then
            rm -f .github/workflows/product-schema-fix-once.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Add required image to MatchApp VIP Product schema"
            git push origin HEAD:seo/product-image-fix-20260917
            echo PRODUCT_SCHEMA_FIX_COMMITTED=1
          else
            echo PRODUCT_SCHEMA_FIX_COMMITTED=0
          fi
          exit 0
