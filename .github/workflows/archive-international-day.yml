name: Archive outgoing International Day
on:
  push:
    branches: [main]
    paths:
      - 'data/international-day.json'

permissions:
  contents: write

concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Preserve the outgoing day record
        run: node tools/archive-international-day.cjs
      - name: Publish retained event history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "matchapp-events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/international-day-history.json
          if git diff --staged --quiet; then
            echo "No outgoing International Day to archive."
            exit 0
          fi
          git commit -m "Events: retain ended International Day"
          git push origin HEAD:main
