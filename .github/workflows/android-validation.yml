name: Validate Android apps

on:
  push:
    branches: [main]
    paths:
      - 'android-studio/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both Android debug apps
        working-directory: android-studio
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :kidsapp:assembleDebug --no-daemon --stacktrace
