name: Validate Android apps

on:
  push:
    branches: [main]
    paths:
      - 'android-studio/**'
      - '.github/workflows/android-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-studio/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check adult Play identity and safe AdMob staging
        run: python3 android-studio/scripts/verify_adult_release.py
      - name: Compile adult debug, unsigned release bundle and Kids regression
        working-directory: android-studio
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease :kidsapp:assembleDebug --no-daemon --stacktrace
      - name: Verify unsigned adult AAB and create checksum
        working-directory: android-studio
        run: |
          BUNDLE=app/build/outputs/bundle/release/app-release.aab
          test -s "$BUNDLE"
          unzip -t "$BUNDLE" > /dev/null
          sha256sum "$BUNDLE" > app/build/outputs/bundle/release/app-release.aab.sha256
          printf '%s\n' 'UNSIGNED RELEASE AAB - NOT READY FOR PLAY CONSOLE UPLOAD.' 'Use your private Play upload keystore to sign it locally, or use Android Studio > Generate Signed Bundle on the app module.' 'Package: com.jonas.papercup; version: 1.1.31; versionCode: 33.' > app/build/outputs/bundle/release/README-UNSIGNED.txt
      - name: Export adult-only AAB for local signing
        uses: actions/upload-artifact@v4
        with:
          name: MatchApp-Ai-adult-1.1.31-code33-UNSIGNED-AAB
          path: |
            android-studio/app/build/outputs/bundle/release/app-release.aab
            android-studio/app/build/outputs/bundle/release/app-release.aab.sha256
            android-studio/app/build/outputs/bundle/release/README-UNSIGNED.txt
          if-no-files-found: error
          retention-days: 14
