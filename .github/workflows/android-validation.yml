name: Validate Android apps

on:
  push:
    branches: [main]
    paths:
      - 'android-studio/**'
      - '.github/workflows/android-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-studio/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check adult Play identity and safe AdMob staging
        run: python3 android-studio/scripts/verify_adult_release.py
      - name: Compile adult debug, unsigned release bundle and Kids regression
        working-directory: android-studio
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease :kidsapp:assembleDebug --no-daemon --stacktrace
