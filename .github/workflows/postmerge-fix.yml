name: Apply post-merge bug fixes

on:
  push:
    branches:
      - main
    paths:
      - tools/postmerge_bugfix.py
      - .github/workflows/postmerge-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply fixes
        run: python tools/postmerge_bugfix.py

      - name: Validate JavaScript
        run: |
          node --check settings.js
          node --check discover.js
          node --check kids/kids.js
          grep -q "const AI_TIMEOUT_MS = 30000" discover.js
          grep -q "!skipLiveLookup" discover.js
          grep -q "escapeDiscoverHtml" discover.js
          grep -q "events-archive.html" settings.js
          grep -q "grid-' + i" kids/kids.js

      - name: Commit fixes
        run: |
          git config user.name "matchapp-bugfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add settings.js discover.js kids/kids.js
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix post-merge regressions and Kids/Ask AI bugs"
            git push origin main
          fi
