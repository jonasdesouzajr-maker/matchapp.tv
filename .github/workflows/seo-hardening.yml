name: Apply scoped SEO hardening

on:
  push:
    branches: [main]
    paths:
      - 'tools/seo-hardening.js'
      - '.github/workflows/seo-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchapp-seo-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Apply verified metadata and schema fixes
        run: node tools/seo-hardening.js
      - name: Rebuild catalog SEO pages with corrected metadata limits
        run: node tools/build-seo-pages.js
      - name: Refresh sitemap lastmod and URL inventory
        run: node tools/update-sitemap.js
      - name: Validate site
        run: npm test
      - name: Commit scoped SEO output
        run: |
          if git diff --quiet; then
            echo "SEO output already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html discover.html kids/index.html tools/build-seo-pages.js tools/refresh-news-rss.js tools/seo-urls.json news sitemap.xml
          for d in moods collections platforms languages decades; do
            [ -e "$d" ] && git add "$d"
          done
          git commit -m "Harden Search Console metadata and structured data"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
