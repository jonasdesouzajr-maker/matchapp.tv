name: Apply scoped SEO hardening

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'tools/seo-hardening.js'
      - 'tools/update-sitemap.js'
      - 'tools/build-seo-pages.js'
      - 'tests/performance-smoothness.test.cjs'
      - '.github/workflows/seo-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Apply verified metadata and schema fixes
        run: node tools/seo-hardening.js
      - name: Rebuild catalog SEO pages with corrected metadata limits
        run: node tools/build-seo-pages.js
      - name: Refresh sitemap lastmod and URL inventory
        run: node tools/update-sitemap.js
      - name: Validate site
        run: npm test
      - name: Commit scoped SEO output with retry
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              git clean -fd
              node tools/seo-hardening.js
              node tools/build-seo-pages.js
              node tools/update-sitemap.js
            fi
            git add index.html discover.html kids/index.html sitemap.xml sitemaps.xml tools/build-seo-pages.js tools/refresh-news-rss.js tools/seo-urls.json
            for d in moods collections platforms languages decades; do [ -e "$d" ] && git add "$d"; done
            if git diff --staged --quiet; then
              echo "SEO output already current"
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Harden Search Console metadata and structured data" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Deploy refreshed content
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
