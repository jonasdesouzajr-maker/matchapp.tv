name: Rebuild Kids SEO guides

on:
  push:
    branches: [main]
    paths:
      - 'kids/kids.js'
      - 'kids/watch-links.json'
      - 'tools/build-kids-pages.js'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild reviewed Kids title pages
        run: node tools/build-kids-pages.js
      - name: Refresh sitemap
        run: node tools/update-sitemap.js
      - name: Validate generated search surfaces
        run: |
          npm test
          npm run audit:search
      - name: Commit generated Kids SEO pages with retry
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              git clean -fd
              node tools/build-kids-pages.js
              node tools/update-sitemap.js
              npm test
              npm run audit:search
            fi
            git add kids/titles kids/nostalgia tools/kids-urls.json tools/kids-sitemap-meta.json sitemap.xml sitemaps.xml
            if git diff --staged --quiet; then
              echo "Kids SEO guides already current"
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Refresh Kids SEO guides"
            published="$(git rev-parse HEAD)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            if git merge-base --is-ancestor "$published" "origin/${GITHUB_REF_NAME}"; then
              echo 'changed=1' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(git rev-parse HEAD~1)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
              echo "::error::Push failed without newer main; stop rather than resubmit an unknown outcome."
              exit 1
            fi
          done
          exit 1

      - name: Validate and deploy bot-published main commit
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
