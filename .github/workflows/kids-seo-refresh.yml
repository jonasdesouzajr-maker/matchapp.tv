name: Rebuild Kids SEO guides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kids-seo-refresh.yml'
      - 'kids/kids.js'
      - 'kids/watch-links.json'
      - 'tools/build-kids-pages.js'
      - 'tools/update-sitemap.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matchapp-kids-seo
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild reviewed Kids title pages
        run: node tools/build-kids-pages.js
      - name: Refresh sitemap
        run: node tools/update-sitemap.js
      - name: Validate generated search surfaces
        run: |
          npm test
          npm run audit:search
      - name: Commit generated Kids SEO pages
        run: |
          if git diff --quiet -- kids/titles kids/nostalgia tools/kids-urls.json tools/kids-sitemap-meta.json sitemap.xml; then
            echo "Kids SEO guides already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids/titles kids/nostalgia tools/kids-urls.json tools/kids-sitemap-meta.json sitemap.xml
          git commit -m "Refresh Kids SEO guides"
          # Audits write reports outside the generated SEO set. Reset only the
          # ephemeral runner worktree after the intended commit so rebase stays clean.
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
