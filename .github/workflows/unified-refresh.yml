name: MatchApp Unified Daily Refresh

on:
  schedule:
    # 01:30 America/Sao_Paulo (UTC-3): one complete daily refresh.
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unified-refresh.yml'
      - 'tools/unified-refresh.cjs'

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false

jobs:
  refresh:
    # Owner-requested AdSense review hold, 2026-10-31. Remove this condition
    # when the owner resumes publishing. The original triggers and gates stay intact.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Catalog enrichment obtains the existing short-lived GitHub OIDC token.
      # Regional availability retains its existing server-side TMDB secrets.
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts
      - name: Preflight source contracts and required availability credential
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/release-audit.test.cjs
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_TOKEN" ]; then
            echo '::error::The existing TMDB_READ_TOKEN or TMDB_API_KEY repository secret is required.'
            exit 1
          fi
      - name: Generate all verified daily content once
        run: node tools/unified-refresh.cjs generate

      - name: Publish verified daily editorial refresh
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              npm ci --ignore-scripts
              # Regenerate from the new source; never rebase stale generated data.
              node tools/unified-refresh.cjs generate
            fi
            node --test tests/release-audit.test.cjs
            node tools/check-content-rotation.js
            npm test
            npm run audit:site
            npm run build
            node tools/unified-refresh.cjs stage
            if git diff --staged --quiet; then
              echo 'No content changes after successful source checks and validation.'
              echo 'changed=0' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'Refresh all verified daily MatchApp content'
            published="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              echo 'changed=1' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin main
            if git merge-base --is-ancestor "$published" origin/main; then
              echo 'changed=1' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(git rev-parse HEAD~1)" = "$(git rev-parse origin/main)" ]; then
              echo '::error::Push failed without newer main; stop rather than resubmit an unknown outcome.'
              exit 1
            fi
            echo 'Remote main advanced; regenerate and revalidate before retry.'
          done
          echo '::error::Unified refresh did not safely publish after three validated attempts.'
          exit 1

      - name: Validate and deploy the one completed refresh
        id: delivery
        uses: actions/github-script@v8
        env:
          CONTENT_CHANGED: ${{ steps.publish.outputs.changed }}
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const result = await exec.getExecOutput('git', ['rev-parse', 'HEAD']);
            const expectedSha = result.stdout.trim();
            if (!/^[a-f0-9]{40}$/.test(expectedSha)) throw new Error('Cannot establish the validated publication SHA.');
            const evidence = {expectedSha, contentChanged: process.env.CONTENT_CHANGED === '1', startedAt: new Date().toISOString(), status: 'pending'};
            const directory = 'artifacts/unified-refresh';
            fs.mkdirSync(directory, {recursive: true});
            const save = () => fs.writeFileSync(`${directory}/delivery.json`, JSON.stringify(evidence, null, 2) + '\n');
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            async function liveSha() {
              const response = await fetch(`https://matchapp.tv/deployment-sha.txt?unified=${context.runId}-${Date.now()}`, {signal: AbortSignal.timeout(20000)});
              if (!response.ok) throw new Error(`Production deployment marker returned HTTP ${response.status}.`);
              const sha = (await response.text()).trim();
              if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Production deployment marker is malformed.');
              return sha;
            }
            async function waitForExisting(workflow, key, requestedAt) {
              evidence[key] = evidence[key] || {workflow, requestedAt, status: 'awaiting-existing-run'};
              save();
              const deadline = Date.now() + 20 * 60 * 1000;
              while (Date.now() < deadline) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {owner, repo, workflow_id: workflow, event: 'workflow_dispatch', created: `>=${requestedAt}`, per_page: 100});
                const matches = runs.filter(run => run.head_sha === expectedSha && run.created_at >= requestedAt);
                if (matches.length > 1) throw new Error(`Multiple ${workflow} runs match this request; stop rather than guess notification ownership.`);
                const run = matches[0];
                if (run) {
                  evidence[key] = {...evidence[key], runId: run.id, url: run.html_url, status: run.status, conclusion: run.conclusion};
                  save();
                  if (run.status === 'completed') {
                    if (run.conclusion !== 'success') throw new Error(`${workflow} did not succeed: ${run.conclusion}; ${run.html_url}`);
                    return;
                  }
                }
                await sleep(10000);
              }
              throw new Error(`${workflow} completion was not confirmed; its existing request must be reconciled before any retry.`);
            }
            async function dispatchAndConfirm(workflow, key) {
              // Actions timestamps have whole-second precision.
              const requestedAt = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
              evidence[key] = {workflow, requestedAt, status: 'submitting'};
              save();
              // A lost response remains unknown. Never repeat the dispatch.
              await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id: workflow, ref: 'main'});
              evidence[key].status = 'requested';
              save();
              return waitForExisting(workflow, key, requestedAt);
            }
            try {
              save();
              // Pages owns IndexNow after changes. For a genuinely unchanged,
              // already deployed revision, perform the previous daily discovery
              // recovery once without an unnecessary deployment or source rerun.
              const alreadyLive = evidence.contentChanged ? false : (await liveSha()) === expectedSha;
              if (alreadyLive) {
                evidence.liveSha = expectedSha;
                await dispatchAndConfirm('indexnow.yml', 'discovery');
              } else {
                await dispatchAndConfirm('pages-deploy.yml', 'pages');
                for (let attempt = 0; attempt < 30; attempt++) {
                  evidence.liveSha = await liveSha();
                  save();
                  if (evidence.liveSha === expectedSha) break;
                  await sleep(10000);
                }
                if (evidence.liveSha !== expectedSha) throw new Error('Pages completed, but the validated SHA was not confirmed on the live domain.');
                // The existing successful Pages owner dispatches IndexNow once.
                // This coordinator never submits a second changed-content ping.
                await waitForExisting('indexnow.yml', 'discovery', evidence.pages.requestedAt);
              }
              evidence.status = 'success';
              evidence.completedAt = new Date().toISOString();
              save();
              await core.summary.addHeading('Unified daily refresh').addRaw(`Verified source generation, release gates and production SHA ${expectedSha}.\n`).addRaw(evidence.contentChanged ? 'One content publication; Pages owns search discovery.\n' : 'Unchanged content; confirmed production and one discovery recovery.\n').write();
            } catch (error) {
              evidence.status = 'failed-or-unconfirmed';
              evidence.error = error.message;
              save();
              throw error;
            }

      - name: Install the existing pinned live-browser runtime
        run: npx playwright install --with-deps chromium

      - name: Verify the exact published revision in the real production browser
        timeout-minutes: 24
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const {spawnSync} = require('node:child_process');
          const {fetchDeploymentMarker} = require('./tools/deployment-marker.cjs');
          const directory = 'artifacts/unified-refresh';
          const delivery = JSON.parse(fs.readFileSync(`${directory}/delivery.json`, 'utf8'));
          const evidence = {expectedSha: delivery.expectedSha, startedAt: new Date().toISOString(), status: 'pending'};
          const save = () => fs.writeFileSync(`${directory}/browser.json`, JSON.stringify(evidence, null, 2) + '\n');
          (async () => {
            try {
              save();
              evidence.beforeSha = (await fetchDeploymentMarker('https://matchapp.tv')).trim();
              save();
              if (evidence.beforeSha !== evidence.expectedSha) throw new Error('Production changed before browser validation; this revision has not been tested.');
              // Reuse the unchanged desktop/tablet/phone production test. No
              // simulated account, source, artwork or AI response is substituted.
              const run = spawnSync(process.execPath, ['tools/live-production-smoke.cjs'], {stdio: 'inherit', timeout: 22 * 60 * 1000});
              evidence.exitCode = run.status;
              evidence.afterSha = (await fetchDeploymentMarker('https://matchapp.tv')).trim();
              const reportFile = 'artifacts/live-smoke/report.json';
              if (fs.existsSync(reportFile)) {
                const report = JSON.parse(fs.readFileSync(reportFile, 'utf8'));
                evidence.checks = report.checks?.length || 0;
                evidence.errors = report.errors || [];
                evidence.warnings = report.warnings || [];
              }
              save();
              if (run.error) throw run.error;
              if (run.status !== 0) throw new Error(`Production browser smoke failed with exit code ${run.status}.`);
              if (!evidence.checks || evidence.errors.length) throw new Error('Browser report did not prove all production checks passed.');
              if (evidence.afterSha !== evidence.expectedSha) throw new Error('Production advanced during browser validation; do not attribute this test to a different revision.');
              evidence.status = 'success';
              evidence.testedSha = evidence.expectedSha;
              evidence.completedAt = new Date().toISOString();
              save();
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nProduction browser checks: ${evidence.checks} passed for ${evidence.testedSha}. Any external-source warnings remain in the report.\n`);
            } catch (error) {
              evidence.status = 'failed-or-unconfirmed';
              evidence.error = error.message;
              save();
              console.error(error.message);
              process.exitCode = 1;
            }
          })();
          NODE

      - name: Preserve generation, delivery and live-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MatchApp-unified-refresh-${{ github.run_id }}
          path: |
            artifacts/unified-refresh/
            artifacts/live-smoke/
          if-no-files-found: warn
          retention-days: 30
