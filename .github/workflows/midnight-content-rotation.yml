name: Midnight content rotation and SEO injection
# Runs the complete daily refresh from a clean, validated main checkout.

on:
  schedule:
    # 00:00 America/Sao_Paulo (UTC-3; Brazil currently has no DST)
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/midnight-content-rotation.yml'

permissions:
  contents: write
  actions: write
  issues: write
  id-token: write

concurrency:
  group: matchapp-content-publish
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Snapshot before rotation
        run: |
          git rev-parse HEAD > /tmp/before.sha
          mkdir -p reports

      - name: Refresh title catalog and media
        run: node tools/sync-catalog-media.js

      - name: Refresh entertainment and AI news
        run: node tools/refresh-news-rss.js

      - name: Refresh active/upcoming events and dated awareness spotlight
        run: |
          node tools/build-global-events.js
          node tools/archive-international-day.mjs
          node tools/awareness-bot.mjs

      - name: Rebuild SEO pages, JSON-LD and watch pages
        run: |
          node tools/build-seo-pages.js
          node tools/build-watch-pages.js

      - name: Refresh sitemap and validate search readiness
        run: |
          node tools/update-sitemap.js
          node tools/check-content-rotation.js
          node tools/audit-site.js
          node tools/audit-search.js
          node tools/search-readiness.js
          npm test
          npm run build

      - name: Publish rotation atomically on a fresh main snapshot
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only editorial generator outputs are owned by this bot. Never stage
          # unrelated application, Ads, auth, Android or hand-curated Top Titles files.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
              # Never transplant stale generated content across a human/bot push.
              # Rebuild from the latest committed title, event, news and SEO inputs.
              node tools/sync-catalog-media.js
              node tools/refresh-news-rss.js
              node tools/build-global-events.js
              node tools/archive-international-day.mjs
              node tools/awareness-bot.mjs
              node tools/build-seo-pages.js
              node tools/build-watch-pages.js
              node tools/update-sitemap.js
              node tools/check-content-rotation.js
              node tools/audit-site.js
              node tools/audit-search.js
              node tools/search-readiness.js
              npm test
              npm run build
            fi
            git add -A -- index.html events events-archive.html news where-to-watch
            git add -A -- awareness/current.json awareness/*/index.html
            git add -A -- tools/event-urls.json tools/awareness-urls.json tools/news-urls.json tools/news-sitemap-meta.json tools/seo-urls.json tools/watch-urls.json
            git add -A -- data/international-day-history.json sitemap.xml sitemaps.xml
            for d in moods collections platforms languages decades; do
              if [ -e "$d" ]; then git add -A -- "$d"; fi
            done
            if git diff --staged --quiet; then
              echo 'changed=0' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Daily midnight content and SEO rotation"
            if git push origin HEAD:main; then
              echo 'changed=1' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Remote main advanced; rebuilding all editorial outputs before retry $((attempt+1))."
          done
          echo "::error::Content rotation did not safely publish after 3 attempts."
          exit 1

      - name: Deploy refreshed frontend
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages-deploy.yml --ref main
          echo 'DEPLOYED=1' >> "$GITHUB_ENV"

      - name: Submit refreshed URLs to IndexNow
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run indexnow.yml --ref main
          echo 'INDEXNOW=1' >> "$GITHUB_ENV"

      - name: Build report and post to issue #1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.publish.outputs.changed || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/before.sha ]; then
            export BEFORE_SHA="$(cat /tmp/before.sha)"
          else
            export BEFORE_SHA="${GITHUB_SHA}"
          fi
          export DEPLOYED="${DEPLOYED:-0}"
          export INDEXNOW="${INDEXNOW:-0}"
          if [ "$JOB_STATUS" != "success" ]; then
            export ROTATION_ERROR="A workflow step failed. See ${RUN_URL}"
          fi
          node tools/midnight-report.js
          cat reports/midnight-latest.md >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file reports/midnight-latest.md

      - name: Notify phone with execution report
        if: success()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          if [ -z "$TOPIC" ]; then
            echo 'Phone report skipped: NTFY_TOPIC is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          REPORT="$(cat reports/midnight-latest.md 2>/dev/null || printf 'Midnight rotation completed successfully.')"
          curl -fsS -H 'Title: MatchApp TV midnight rotation ✅' \
            -H 'Tags: white_check_mark,movie_camera' \
            --data-binary "$REPORT" "https://ntfy.sh/$TOPIC"

      - name: Preserve report and notify on failure
        if: failure()
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          echo 'Midnight rotation failed. No success confirmation should be issued until the failing step is corrected.' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TOPIC" ]; then
            curl -fsS -H 'Title: MatchApp TV midnight rotation FAILED' \
              -H 'Tags: x,movie_camera' \
              -d "The midnight content rotation failed. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              "https://ntfy.sh/$TOPIC" || true
          fi
