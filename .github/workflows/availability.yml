name: Refresh Streaming Availability

# Availability changes on the scale of weeks, not minutes, so a weekly refresh
# is the right cadence: frequent enough that pages stay honest, infrequent
# enough that we stay well inside TMDB's free-tier limits (~370 calls a run).
on:
  schedule:
    - cron: '0 5 * * 1'        # Mondays, 05:00 UTC
  workflow_dispatch:            # and on demand

permissions:
  contents: write
  actions: write

concurrency:
  group: content-bot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked build dependencies
        run: npm ci --ignore-scripts

      - name: Fetch availability from TMDB
        env:
          # Both are passed; the script prefers the v4 read token and falls
          # back to the v3 key, so either alone is enough to run.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: |
          if [ -z "$TMDB_API_KEY" ] && [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::error::No TMDB credential is set."
            echo "Add TMDB_READ_TOKEN (preferred) or TMDB_API_KEY under"
            echo "Settings -> Secrets and variables -> Actions."
            echo "Both are available at https://www.themoviedb.org/settings/api"
            exit 1
          fi
          node tools/fetch-availability.js

      - name: Rebuild availability pages
        run: node tools/build-watch-pages.js

      - name: Rebuild collection pages
        run: node tools/build-seo-pages.js

      - name: Update sitemap
        run: node tools/update-sitemap.js

      - name: Commit and push with retry
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MatchApp Bot"
          git config user.email "bot@matchapp.tv"
          changed=0
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git reset --hard HEAD
              git clean -fd
              git pull --rebase origin "${GITHUB_REF_NAME}"
              node tools/fetch-availability.js
              node tools/build-watch-pages.js
              node tools/build-seo-pages.js
              node tools/update-sitemap.js
            fi
            git add -A
            if git diff --staged --quiet; then
              echo "No availability changes this run."
              echo "changed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Refresh streaming availability from TMDB [skip ci]" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              changed=1
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing and regenerating."
          done
          exit 1
      - name: Deploy refreshed content
        if: steps.publish.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
