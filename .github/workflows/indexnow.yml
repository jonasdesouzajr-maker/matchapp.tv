name: Automated IndexNow SEO Ping

# Notifies Bing and Yandex when content changes.
#
# Google is deliberately NOT pinged here: Google deprecated its sitemap ping
# endpoint in June 2023 and it now returns 404. Google's supported routes are
# the Sitemap line in robots.txt (already in place) and Search Console, which
# needs an authenticated human. Adding a Google ping would only generate
# failing requests.

on:
  schedule:
    - cron: '0 8 * * *' # Daily at 08:00 UTC
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Broadcast sitemap URLs to IndexNow (Bing & Yandex)
        env:
          INDEX_KEY: ${{ secrets.INDEX_NOW_KEY }}
        run: |
          # IndexNow is optional and should never break a production push
          # when the secret is not configured.
          if [ -z "$INDEX_KEY" ]; then
            echo "INDEX_NOW_KEY is not configured; skipping optional notification."
            exit 0
          fi

          node - <<'NODE'
          const https = require('https');
          const fs = require('fs');

          const key = process.env.INDEX_KEY;
          const xml = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...xml.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map(m => m[1]);

          if (!urls.length) {
            throw new Error('No <loc> entries found in sitemap.xml');
          }

          let host;
          try {
            host = new URL(urls[0]).host;
          } catch {
            throw new Error(`Invalid sitemap URL: ${urls[0]}`);
          }

          const mismatched = urls.filter(url => {
            try { return new URL(url).host !== host; } catch { return true; }
          });

          if (mismatched.length) {
            throw new Error('Sitemap contains invalid or mixed-host URLs');
          }

          const payload = JSON.stringify({
            host,
            key,
            keyLocation: `https://${host}/${key}.txt`,
            urlList: urls
          });

          function submit(attempt = 1) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'api.indexnow.org',
                path: '/indexnow',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json; charset=utf-8',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, res => {
                res.resume();
                res.on('end', () => {
                  if (res.statusCode === 200 || res.statusCode === 202) {
                    console.log(`IndexNow accepted ${urls.length} URLs (HTTP ${res.statusCode}).`);
                    return resolve();
                  }

                  if (attempt < 3 && (res.statusCode === 429 || res.statusCode >= 500)) {
                    const delay = attempt * 2000;
                    console.warn(`IndexNow returned HTTP ${res.statusCode}; retrying in ${delay}ms.`);
                    return setTimeout(() => submit(attempt + 1).then(resolve, reject), delay);
                  }

                  reject(new Error(`IndexNow rejected the submission (HTTP ${res.statusCode})`));
                });
              });

              req.setTimeout(30000, () => req.destroy(new Error('IndexNow request timed out')));

              req.on('error', error => {
                if (attempt < 3) {
                  const delay = attempt * 2000;
                  console.warn(`${error.message}; retrying in ${delay}ms.`);
                  return setTimeout(() => submit(attempt + 1).then(resolve, reject), delay);
                }
                reject(error);
              });

              req.end(payload);
            });
          }

          submit().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
