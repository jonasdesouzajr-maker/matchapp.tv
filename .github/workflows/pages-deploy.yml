name: Deploy MatchApp Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Newest commit wins so overlapping bot/human publishes do not 400.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://matchapp.tv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify immutable AdSense contract
        run: node --test --test-isolation=none tests/adsense-lock.test.cjs
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Keep build metadata aligned with release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release.json').version")"
          node - <<'NODE'
          const fs=require('fs');
          const release=require('./release.json').version;
          const file='build-meta.js';
          let src=fs.readFileSync(file,'utf8');
          src=src.replace(/window\.MATCHAPP_BUILD\s*=\s*'[^']+';/,`window.MATCHAPP_BUILD = '${release}';`);
          fs.writeFileSync(file,src);
          NODE
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" build-meta.js
          git diff --exit-code -- build-meta.js || {
            echo "::error::build-meta.js did not match release.json in source. Commit the synchronized version before merging."
            exit 1
          }
      - name: Validate production sources
        run: |
          node --check app.js
          node --check discover.js
          node --check catalog-media.js
          node --check tmdb.js
          node --check title-experience.js
          node --check notifications.js
          node --check onboarding-tour.js
          node --check catalog-plus.js
          node --check sw.js
          node --check kids/kids.js
          node --check settings.js
          node --check profile.js
          npm test
          npm run audit:site
      - name: Verify committed news, events, awareness and ten-title editorial contracts
        run: node tools/check-content-rotation.js
      - name: Generate bilingual social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 1200 -h 630 assets/brand/matchapp-og.svg -o og-image-v3.png
          test -s og-image-v3.png
      - name: Stamp exact deployment identity
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > deployment-sha.txt
          test "$(cat deployment-sha.txt)" = "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
