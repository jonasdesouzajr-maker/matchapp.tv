name: Deploy MatchApp Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

# Queue Pages deploys in arrival order instead of cancelling active or pending releases.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://matchapp.tv
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify immutable AdSense contract
        run: node --test --test-isolation=none tests/adsense-lock.test.cjs
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Keep build metadata aligned with release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release.json').version")"
          node - <<'NODE'
          const fs=require('fs');
          const release=require('./release.json').version;
          const file='build-meta.js';
          let src=fs.readFileSync(file,'utf8');
          src=src.replace(/window\.MATCHAPP_BUILD\s*=\s*'[^']+';/,`window.MATCHAPP_BUILD = '${release}';`);
          fs.writeFileSync(file,src);
          NODE
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" build-meta.js
          git diff --exit-code -- build-meta.js || {
            echo "::error::build-meta.js did not match release.json in source. Commit the synchronized version before merging."
            exit 1
          }
      - name: Synchronize approved social artwork and metadata
        run: node tools/sync-social-previews.cjs && node tools/sync-social-previews.cjs --check
      - name: Validate production sources
        run: |
          node --check app.js
          node --check discover.js
          node --check catalog-media.js
          node --check tmdb.js
          node --check title-experience.js
          node --check notifications.js
          node --check onboarding-tour.js
          node --check catalog-plus.js
          node --check sw.js
          node --check kids/kids.js
          node --check kids/immersive.js
          node --check kids/lumi-assistant.js
          node --check voice-input.js
          node --check settings.js
          node --check profile.js
          npm test
          npm run audit:site
      - name: Verify committed news, events, awareness and ten-title editorial contracts
        run: node tools/check-content-rotation.js
      - name: Generate bilingual social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 1200 -h 630 assets/brand/matchapp-og.svg -o og-image-v3.png
          test -s og-image-v3.png
      - name: Stamp content-based URLs for discovery and native feedback
        run: node tools/stamp-discovery-assets.cjs
      - name: Stamp exact deployment identity
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > deployment-sha.txt
          test "$(cat deployment-sha.txt)" = "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node.js 24 uploader)
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
          # v3 included dotfiles; v5 defaults to excluding them. Preserve the live artifact.
          include-hidden-files: true
      # Upload finalization can precede artifact visibility in the Actions API.
      # Deploy-pages queries that API immediately and otherwise fails with "Found 0 artifact(s)".
      - name: Wait until uploaded Pages artifact is indexed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].name' | grep -Fxq "${ARTIFACT_NAME}"; then
              echo "Artifact ${ARTIFACT_NAME} is indexed (attempt ${attempt})."
              # Allow Pages metadata readers to catch up with the upload index.
              sleep 5
              exit 0
            fi
            echo "Artifact ${ARTIFACT_NAME} not indexed yet (attempt ${attempt}/24)."
            sleep 5
          done
          echo "::error::Pages artifact is not visible after 120s; refusing to deploy stale content."
          exit 1
      - name: Deploy validated Pages artifact
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node.js 24)
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Submit IndexNow only after confirmed Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run indexnow.yml --ref main

      # A GITHUB_TOKEN-dispatched Pages run does not reliably emit workflow_run.
      # Pages owns the one explicit request, independently of IndexNow delivery.
      - name: Request one live smoke for the deployed SHA
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        uses: actions/github-script@v8
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const {requestReleaseSmoke} = require('./tools/release-smoke-dispatch.cjs');
            const directory = 'artifacts/release-smoke-dispatch';
            fs.mkdirSync(directory, {recursive: true});
            const save = evidence => fs.writeFileSync(`${directory}/delivery.json`, JSON.stringify(evidence, null, 2) + '\n');
            const evidence = await requestReleaseSmoke({github, context,
              expectedSha: process.env.GITHUB_SHA,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), save});
            await core.summary.addHeading('Production smoke delivery')
              .addRaw(`SHA ${evidence.expectedSha}: ${evidence.status}\n`)
              .addLink('Existing smoke run', evidence.smokeUrl).write();
      # Hold the Pages concurrency slot until the exact matching live smoke completes.
      # Without this barrier, a queued deployment can replace production during Playwright
      # and make the smoke fail its correct before/after deployment-identity assertion.
      - name: Wait for the exact live smoke before releasing the Pages queue
        if: ${{ success() && steps.deploy.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          evidence="artifacts/release-smoke-dispatch/delivery.json"
          test -s "$evidence"
          smoke_id="$(node -e "const d=require('./artifacts/release-smoke-dispatch/delivery.json'); if (!Number.isSafeInteger(d.smokeRunId) || d.smokeRunId < 1) process.exit(2); process.stdout.write(String(d.smokeRunId));")"
          expected_title="Release smoke: ${EXPECTED_SHA}"
          for attempt in $(seq 1 180); do
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${smoke_id}")"
            title="$(jq -r '.display_title // ""' <<< "$run_json")"
            event="$(jq -r '.event // ""' <<< "$run_json")"
            path="$(jq -r '.path // ""' <<< "$run_json")"
            branch="$(jq -r '.head_branch // ""' <<< "$run_json")"
            status="$(jq -r '.status // ""' <<< "$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"
            if [[ "$title" != "$expected_title" || "$event" != "workflow_dispatch" || "$path" != ".github/workflows/release-smoke.yml" || "$branch" != "main" ]]; then
              echo "::error::Smoke run identity does not match the deployed SHA and expected workflow."
              exit 1
            fi
            case "$status" in
              completed)
                if [[ "$conclusion" == "success" ]]; then
                  echo "Live smoke $smoke_id passed for $EXPECTED_SHA."
                  exit 0
                fi
                echo "::error::Live smoke $smoke_id completed with conclusion '$conclusion'."
                exit 1
                ;;
              queued|in_progress|waiting|pending|requested)
                echo "Waiting for live smoke $smoke_id (attempt $attempt/180; status=$status)."
                sleep 10
                ;;
              *)
                echo "::error::Live smoke $smoke_id entered unexpected status '$status'."
                exit 1
                ;;
            esac
          done
          echo "::error::Live smoke $smoke_id did not finish within 30 minutes; keeping the release incomplete."
          exit 1
      - name: Keep smoke dispatch and reconciliation evidence
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: MatchApp-release-smoke-delivery-${{ github.run_attempt }}
          path: artifacts/release-smoke-dispatch/
          if-no-files-found: warn
          retention-days: 14
