name: Deploy MatchApp Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://matchapp.tv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Keep build metadata aligned with release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release.json').version")"
          node - <<'NODE'
          const fs=require('fs');
          const release=require('./release.json').version;
          const file='build-meta.js';
          let src=fs.readFileSync(file,'utf8');
          src=src.replace(/window\.MATCHAPP_BUILD\s*=\s*'[^']+';/,`window.MATCHAPP_BUILD = '${release}';`);
          fs.writeFileSync(file,src);
          NODE
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" build-meta.js
          git diff --exit-code -- build-meta.js || {
            echo "::error::build-meta.js did not match release.json in source. Commit the synchronized version before merging."
            exit 1
          }
      - name: Validate production sources
        run: |
          node --check app.js
          node --check discover.js
          node --check catalog-media.js
          node --check tmdb.js
          node --check title-experience.js
          node --check notifications.js
          node --check onboarding-tour.js
          node --check catalog-plus.js
          node --check sw.js
          node --check kids/kids.js
          node --check settings.js
          node --check profile.js
          npm test
          npm run audit:site
      - name: Generate bilingual social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 1200 -h 630 assets/brand/matchapp-og.svg -o og-image-v3.png
          test -s og-image-v3.png
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  healthcheck:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe live site availability
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          for url in             https://matchapp.tv/             https://matchapp.tv/discover.html             https://matchapp.tv/pricing/pricing.html             https://matchapp.tv/kids/             https://matchapp.tv/android/             https://matchapp.tv/.well-known/assetlinks.json; do
            code="$(curl -sS -L --max-time 30 -o /tmp/body -w '%{http_code}' "$url")"
            echo "$url -> $code"
            test "$code" = "200"
          done

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare purge failed: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID Actions secrets."
            exit 1
          fi
          CF_ZONE_ID="$(printf '%s' "$CF_ZONE_ID" | tr -d '[:space:]')"
          CF_API_TOKEN="$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')"
          if [ "${#CF_ZONE_ID}" -ne 32 ] || printf '%s' "$CF_ZONE_ID" | grep -q '[^0-9a-fA-F]'; then
            echo "Cloudflare purge failed: CLOUDFLARE_ZONE_ID must be exactly 32 hexadecimal characters."
            exit 1
          fi
          http_code="$(curl -sS -o /tmp/cloudflare-purge.json -w '%{http_code}' -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          cat /tmp/cloudflare-purge.json
          echo
          if [ "$http_code" != "200" ]; then
            echo "Cloudflare purge failed with HTTP $http_code."
            exit 1
          fi
          grep -Eq '"success"[[:space:]]*:[[:space:]]*true' /tmp/cloudflare-purge.json || {
            echo "Cloudflare purge response did not report success=true."
            exit 1
          }
          # GitHub Pages/custom-domain propagation can lag the deploy action by
          # a few seconds even after Cloudflare has purged successfully. Wait for
          # the live Home asset key to match this exact checkout instead of
          # treating normal propagation latency as a failed release.
          EXPECTED_IA_CSS="$(grep -oE '/matchapp-ia\.css\?v=[^"]+' index.html | head -n1 || true)"
          echo "Expected Home CSS key: ${EXPECTED_IA_CSS:-missing}"
          test -n "$EXPECTED_IA_CSS"
          LIVE_IA_CSS=""
          for attempt in $(seq 1 12); do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' \
              "https://matchapp.tv/?deploy=${GITHUB_SHA}-$attempt" \
              -o /tmp/home-post-purge.html
            LIVE_IA_CSS="$(grep -oE '/matchapp-ia\.css\?v=[^"]+' /tmp/home-post-purge.html | head -n1 || true)"
            echo "Live Home asset check $attempt/12: expected=$EXPECTED_IA_CSS live=${LIVE_IA_CSS:-missing}"
            if [ "$LIVE_IA_CSS" = "$EXPECTED_IA_CSS" ]; then
              break
            fi
            sleep 5
          done
          if [ "$LIVE_IA_CSS" != "$EXPECTED_IA_CSS" ]; then
            echo "Live Home did not reach the deployed CSS key after 12 checks."
            exit 1
          fi
          # All release/content assertions run against the confirmed post-purge copy.
          curl -fsSL --max-time 30 "https://matchapp.tv/release.json?deploy=${GITHUB_SHA}" -o /tmp/release.json
          curl -fsSL --max-time 30 "https://matchapp.tv/build-meta.js?deploy=${GITHUB_SHA}" -o /tmp/build-meta.js
          VERSION="$(node -p "require('/tmp/release.json').version")"
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" /tmp/build-meta.js
          curl -fsSL --max-time 30 https://matchapp.tv/kids/ -o /tmp/kids.html
          ! grep -q 'GTM-M7J3NNBN' /tmp/kids.html
          grep -q '/kids/kids.css?v=20260921-static1' /tmp/kids.html
          grep -q '/kids/kids.js?v=20260921-static1' /tmp/kids.html
          grep -q '/kids/voice-feedback.js?v=20260921-static1' /tmp/kids.html
          grep -q 'GTM-M7J3NNBN' /tmp/home-post-purge.html
          grep -q 'ca-pub-9541435081010948' /tmp/home-post-purge.html
          ! grep -qi 'adsterra' /tmp/home-post-purge.html
          ! grep -q 'matchapp-tiktok-intro' /tmp/home-post-purge.html
          ! grep -q 'ma-ui-preparing' /tmp/home-post-purge.html
          grep -q '/page-origin.js?v=20260920-freeze2' /tmp/home-post-purge.html
          grep -q '/build-meta.js?v=20260921-release2' /tmp/home-post-purge.html
          grep -q 'matchapp-home-orb-transparent.webp?v=20260920-homebrand4' /tmp/home-post-purge.html
          grep -q 'FInd what to watch here' /tmp/home-post-purge.html
          curl -fsSL --max-time 30 "https://matchapp.tv${LIVE_IA_CSS}&deploy=${GITHUB_SHA}" -o /tmp/home-stability.css
          grep -q '2026-09-20 renderer root guard' /tmp/home-stability.css
          grep -q '2026-09-20 Home compositor stability guard' /tmp/home-stability.css
          grep -q '2026-09-20 Home top-box final freeze guard' /tmp/home-stability.css
          grep -q '2026-09-20 Home brand crop and fold cleanup' /tmp/home-stability.css
          grep -q '2026-09-20 final Home brand visibility lock' /tmp/home-stability.css
          grep -q '2026-09-21 coherent Home stage + AdSense placement pass' /tmp/home-stability.css
          grep -q '2026-09-21 screenshot geometry correction' /tmp/home-stability.css
          ! grep -q 'header-cosmic-8k.svg' /tmp/home-stability.css
          grep -q '/matchapp-ia.js?v=20260921-cta1' /tmp/home-post-purge.html
          grep -q '/catalog-media.js?v=20260920-freeze-final1' /tmp/home-post-purge.html
          grep -q '/app.js?v=20260921-hardening1' /tmp/home-post-purge.html
          grep -q '/poster-wall.css?v=20260921-wall3' /tmp/home-post-purge.html
          grep -q '/lazy.js?v=20260921-hero1' /tmp/home-post-purge.html
          curl -fsSL --max-time 30 'https://matchapp.tv/matchapp-ia.js?v=20260921-cta1' -o /tmp/home-ia.js
          grep -Fq "root.style.overflowAnchor='none'" /tmp/home-ia.js
          grep -Fq "Find My Perfect Match" /tmp/home-ia.js
          grep -Fq "Ask MatchApp Ai" /tmp/home-ia.js
          curl -fsSL --max-time 30 'https://matchapp.tv/lazy.js?v=20260921-hero1' -o /tmp/home-lazy.js
          grep -Fq 'function armSwiftHydration(section)' /tmp/home-lazy.js
          ! grep -Fq "key:'trending'" /tmp/home-lazy.js
          curl -fsSL --max-time 30 'https://matchapp.tv/catalog-media.js?v=20260920-freeze-final1' -o /tmp/home-media.js
          grep -Fq 'TRENDING_CONCURRENCY=2' /tmp/home-media.js
      - name: Browser Home startup and scroll smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chromium-compatible browser found on runner."
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --no-first-run --no-default-browser-check \
            --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/matchapp-chrome \
            about:blank >/tmp/matchapp-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.2
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/matchapp-chrome.log || true
            echo "::error::Headless Chrome did not start."
            exit 1
          fi
          timeout 120s node tools/browser-scroll-smoke.mjs https://matchapp.tv/
      - name: Notify phone (success only)
        if: success()
        env:
          MSG: ${{ github.event.head_commit.message }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          if [ -z "$TOPIC" ]; then
            echo "Phone notification skipped: NTFY_TOPIC is not configured."
            exit 0
          fi
          curl -fsS -H "Title: matchapp.tv deployed ✅" -d "${MSG:-Deployment validated}" "https://ntfy.sh/$TOPIC"
