name: Deploy MatchApp Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://matchapp.tv
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Keep build metadata aligned with release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./release.json').version")"
          node - <<'NODE'
          const fs=require('fs');
          const release=require('./release.json').version;
          const file='build-meta.js';
          let src=fs.readFileSync(file,'utf8');
          src=src.replace(/window\.MATCHAPP_BUILD\s*=\s*'[^']+';/,`window.MATCHAPP_BUILD = '${release}';`);
          fs.writeFileSync(file,src);
          NODE
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" build-meta.js
          git diff --exit-code -- build-meta.js || {
            echo "::error::build-meta.js did not match release.json in source. Commit the synchronized version before merging."
            exit 1
          }
      - name: Validate production sources
        run: |
          node --check app.js
          node --check discover.js
          node --check catalog-media.js
          node --check tmdb.js
          node --check title-experience.js
          node --check notifications.js
          node --check onboarding-tour.js
          node --check catalog-plus.js
          node --check sw.js
          node --check kids/kids.js
          node --check settings.js
          node --check profile.js
          npm test
          npm run audit:site
      - name: Generate bilingual social preview
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 1200 -h 630 assets/brand/matchapp-og.svg -o og-image-v3.png
          test -s og-image-v3.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  healthcheck:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe live site and release consistency
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          for url in             https://matchapp.tv/             https://matchapp.tv/discover.html             https://matchapp.tv/pricing/pricing.html             https://matchapp.tv/kids/             https://matchapp.tv/android/             https://matchapp.tv/.well-known/assetlinks.json; do
            code="$(curl -sS -L --max-time 30 -o /tmp/body -w '%{http_code}' "$url")"
            echo "$url -> $code"
            test "$code" = "200"
          done
          curl -fsSL --max-time 30 https://matchapp.tv/release.json -o /tmp/release.json
          curl -fsSL --max-time 30 https://matchapp.tv/build-meta.js -o /tmp/build-meta.js
          VERSION="$(node -p "require('/tmp/release.json').version")"
          grep -Fq "window.MATCHAPP_BUILD = '$VERSION';" /tmp/build-meta.js
          curl -fsSL --max-time 30 https://matchapp.tv/kids/ -o /tmp/kids.html
          ! grep -q 'GTM-M7J3NNBN' /tmp/kids.html
          curl -fsSL --max-time 30 https://matchapp.tv/ -o /tmp/home.html
          grep -q 'GTM-M7J3NNBN' /tmp/home.html
          grep -q 'ca-pub-9541435081010948' /tmp/home.html
          ! grep -qi 'adsterra' /tmp/home.html
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare purge skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID Actions secrets."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache"             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json"             --data '{"purge_everything":true}'
      - name: Notify phone (success only)
        if: success()
        env:
          MSG: ${{ github.event.head_commit.message }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
        shell: bash
        run: |
          if [ -z "$TOPIC" ]; then
            echo "Phone notification skipped: NTFY_TOPIC is not configured."
            exit 0
          fi
          curl -fsS -H "Title: matchapp.tv deployed ✅" -d "${MSG:-Deployment validated}" "https://ntfy.sh/$TOPIC"
