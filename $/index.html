<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Opening MatchApp</title>
  <link rel="canonical" href="https://matchapp.tv/">
  <script>
    // Use the explicit home document to bypass an old cached root redirect.
    if (/^\/(?:\$|%24)(?:\/index\.html|\/)?$/i.test(location.pathname)) {
      location.replace('/index.html' + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/index.html"></noscript>
</head>
<body>
  <p><a href="/index.html">Open MatchApp</a></p>
</body>
</html>
