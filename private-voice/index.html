<script>
const SUPABASE_URL="https://zkymvqrmbabngsqblyye.supabase.co";

const CLEAN_URL="https://matchapp.tv/private-voice/";

const el={status:document.getElementById("status"),title:document.getElementById("stateTitle"),detail:document.getElementById("stateDetail"),primary:document.getElementById("primary"),secondary:document.getElementById("secondary"),tip:document.getElementById("tip")};
const ua=navigator.userAgent||"";const isAndroid=/Android/i.test(ua);const likelyEmbedded=/ChatGPT|;\s*wv\)|FBAN|FBAV|Instagram|TikTok|Line\//i.test(ua+" "+document.referrer+" "+location.search);
let action="none",secondaryAction="none",pc=null,dc=null,localStream=null,remoteAudio=null,audioCtx=null,localAnalyser=null,remoteAnalyser=null,raf=0,connectTimer=0;
function setView(state,title,detail,primaryLabel,nextAction,{secondaryLabel="",secondaryNext="none",tip="",error=false}={}){document.body.dataset.state=state;el.status.classList.toggle("error",error);el.title.textContent=title;el.detail.textContent=detail;el.primary.textContent=primaryLabel;el.primary.disabled=!primaryLabel||state==="connecting";el.primary.classList.toggle("danger",state==="live");action=nextAction;el.secondary.hidden=!secondaryLabel;el.secondary.textContent=secondaryLabel;secondaryAction=secondaryNext;el.tip.textContent=tip;el.tip.classList.toggle("show",Boolean(tip))}

async function signIn(){setView("connecting","Opening secure sign-in…","You will return here after Google sign-in.","Signing in…","none");const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:CLEAN_URL+"?auth=1&v=5"}});if(error)setView("error","Sign-in could not start",error.message,"Try sign-in again","signin",{error:true})}

function rms(analyser){if(!analyser)return 0;const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);let s=0;for(const v of a){const x=(v-128)/128;s+=x*x}return Math.sqrt(s/a.length)}

async function analyserFor(stream){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")await audioCtx.resume();const src=audioCtx.createMediaStreamSource(stream),an=audioCtx.createAnalyser();an.fftSize=256;src.connect(an);return an}
async function waitForIce(peer){if(peer.iceGatheringState==="complete")return;await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{peer.removeEventListener("icegatheringstatechange",onState);reject(new Error("Timed out while preparing the secure voice connection."))},10000);function onState(){if(peer.iceGatheringState!=="complete")return;clearTimeout(timeout);peer.removeEventListener("icegatheringstatechange",onState);resolve()}peer.addEventListener("icegatheringstatechange",onState);onState()})}
async function startVoice(){cleanup();setView("connecting","Starting private voice…","Requesting microphone and preparing a secure Realtime connection.","Connecting…","none");try{const {data:{session}}=await sb.auth.getSession();if(!session){setView("signin","Private sign-in required","Sign in to your MatchApp account to unlock this owner-only voice page.","Sign in securely","signin");return}if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){showMicBlocked();return}
localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});localAnalyser=await analyserFor(localStream);pc=new RTCPeerConnection();localStream.getAudioTracks().forEach(t=>pc.addTrack(t,localStream));remoteAudio=document.createElement("audio");remoteAudio.autoplay=true;remoteAudio.playsInline=true;pc.ontrack=async e=>{remoteAudio.srcObject=e.streams[0];await remoteAudio.play().catch(()=>{});remoteAnalyser=await analyserFor(e.streams[0])};
dc=pc.createDataChannel("oai-events");dc.addEventListener("open",()=>{try{dc.send(JSON.stringify({type:"response.create",response:{instructions:"Greet Jonas in one short, natural sentence, then wait for him to speak."}}))}catch{}});dc.addEventListener("message",e=>{try{const x=JSON.parse(e.data);if(x.type==="error")setView("error","Voice session error","The Realtime session returned an error.","Try again","start",{error:true})}catch{}});dc.addEventListener("close",()=>{if(pc&&pc.connectionState!=="closed"){cleanup();setView("ready","Private voice ended","Ready whenever you want another call.","Start private voice","start")}});

const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitForIce(pc);const sdp=pc.localDescription?.sdp;if(!sdp)throw new Error("Missing local voice connection offer.");const res=await fetch(SUPABASE_URL+"/functions/v1/private-voice-call",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({sdp})});const answer=await res.text();if(!res.ok){if(res.status===401){setView("signin","Session expired","Sign in again to continue.","Sign in securely","signin");return}if(res.status===403){setView("error","Owner access required","This signed-in MatchApp account is not authorized for this private page.","Return to MatchApp","home",{error:true});return}throw new Error(answer||"Voice service could not start.")}await pc.setRemoteDescription({type:"answer",sdp:answer});connectTimer=setTimeout(()=>{if(pc&&pc.connectionState!=="connected"){cleanup();setView("error","Connection timed out","The voice service did not finish connecting.","Try again","start",{error:true})}},15000)
}catch(e){const name=e?.name||"",msg=String(e?.message||"Private voice could not start.");cleanup();if(name==="NotAllowedError"||name==="SecurityError"){showMicBlocked();return}if(name==="NotFoundError"){setView("error","No microphone found","Connect or enable a microphone, then try again.","Try again","start",{error:true});return}if(name==="NotReadableError"||name==="AbortError"){setView("error","Microphone is busy","Another app may be using the microphone. Close it and try again.","Try again","start",{error:true});return}setView("error","Couldn’t start private voice",msg.length<120?msg:"The secure voice session could not start.","Try again","start",{error:true})}}
async function checkAccess(){const {data:{session}}=await sb.auth.getSession();if(!session){setView("signin","Private sign-in required","Sign in to your MatchApp account to continue.","Sign in securely","signin");return}const {data:{user},error}=await sb.auth.getUser();if(error||!user){setView("signin","Session needs refreshing","Sign in again to refresh private access.","Sign in securely","signin");return}if(isAndroid&&likelyEmbedded&&!location.search.includes("external=1")){setView("blocked","Use Chrome for voice","This in-app browser does not provide reliable microphone access.","Open in Chrome","chrome",{secondaryLabel:"Try here anyway",secondaryNext:"start",tip:"Chrome keeps the microphone permission under your control and is the reliable path for this private call."});return}try{const permission=await navigator.permissions?.query({name:"microphone"});if(permission?.state==="denied"){showMicBlocked();return}}catch{}setView("ready","Ready when you are","Cedar · private Realtime voice","Start private voice","start")}
el.primary.addEventListener("click",()=>{if(action==="start")startVoice();else if(action==="stop"){cleanup();setView("ready","Private voice ended","Ready whenever you want another call.","Start private voice","start")}else if(action==="chrome")openChrome();else if(action==="signin")signIn();else if(action==="home")location.href="/"});el.secondary.addEventListener("click",()=>{if(secondaryAction==="start")startVoice()});window.addEventListener("pagehide",cleanup);document.addEventListener("visibilitychange",()=>{if(document.hidden&&pc?.connectionState!=="connected"&&document.body.dataset.state==="connecting")cleanup()});checkAccess();
