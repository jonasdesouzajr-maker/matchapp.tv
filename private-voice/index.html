  const {data:{user},error}=await sb.auth.getUser();
  if(error||!user){setState("Session needs refreshing","Sign in again on MatchApp Ai, then reload.",true);return null}
  start.disabled=false;setState("Private access ready","Tap start when you want to talk.");return session
}
function rms(analyser){

  let s=0;for(const v of a){const x=(v-128)/128;s+=x*x}return Math.sqrt(s/a.length)
}
function meter(){
  const lv=Math.min(1,rms(localAnalyser)*5),rv=Math.min(1,rms(remoteAnalyser)*6),v=Math.max(lv,rv,.025);
  document.documentElement.style.setProperty("--level",String(v));

}
async function analyserFor(stream){

}
async function waitIce(peer){

}
async function startVoice(){

    const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);

    const answer=await res.text();if(!res.ok)throw new Error(res.status===403?"This MatchApp account is not authorized for the private prototype.":"Voice session could not start.");

function stopMedia(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(remoteAudio){remoteAudio.pause();remoteAudio.srcObject=null;remoteAudio=null}}
