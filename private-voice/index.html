<script>
const SUPABASE_URL="https://zkymvqrmbabngsqblyye.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpreW12cXJtYmFibmdzcWJseXllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDUyNDIsImV4cCI6MjEwMjM4MTI0Mn0._yEVFMfwVU6GBqQ8m3ljfOgA0HSLEDiKMOfYae6ZD8Q";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const state=document.getElementById("state"),sub=document.getElementById("sub"),start=document.getElementById("start"),end=document.getElementById("end"),openBrowser=document.getElementById("openBrowser"),micHelp=document.getElementById("micHelp");
let pc=null,localStream=null,remoteAudio=null,raf=0,audioCtx=null,localAnalyser=null,remoteAnalyser=null;
function setState(a,b,err=false){state.textContent=a;state.classList.toggle("error",err);sub.textContent=b||""}
function showMicHelp(message){
  setState("Microphone access needed",message,true);
  micHelp.textContent="Android: open this page in Chrome, tap the site controls/lock icon, allow Microphone, then tap Start private voice again.";
  micHelp.classList.add("show");openBrowser.classList.add("show");start.disabled=false;start.textContent="Try microphone again";
}
function clearMicHelp(){micHelp.classList.remove("show");openBrowser.classList.remove("show");start.textContent="Start private voice"}
openBrowser.addEventListener("click",()=>{
  const clean="https://matchapp.tv/private-voice/";
  if(/Android/i.test(navigator.userAgent)){
    location.href="intent://matchapp.tv/private-voice/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(clean)+";end";
  }else{window.open(clean,"_blank","noopener")}
});
async function authReady(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){setState("Sign in to MatchApp Ai first","Open matchapp.tv, sign in, then reload this private page.",true);return null}
  const {data:{user},error}=await sb.auth.getUser();
  if(error||!user){setState("Session needs refreshing","Sign in again on MatchApp Ai, then reload.",true);return null}
  start.disabled=false;setState("Private access ready","Tap start when you want to talk.");try{const p=await navigator.permissions?.query({name:"microphone"});if(p?.state==="denied")showMicHelp("The browser has microphone permission blocked for this page.")}catch{}return session
}
function rms(analyser){
  if(!analyser)return 0;const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);
  let s=0;for(const v of a){const x=(v-128)/128;s+=x*x}return Math.sqrt(s/a.length)
}
function meter(){
  const lv=Math.min(1,rms(localAnalyser)*5),rv=Math.min(1,rms(remoteAnalyser)*6),v=Math.max(lv,rv,.025);
  document.documentElement.style.setProperty("--level",String(v));
  if(pc&&pc.connectionState==="connected"){if(rv>.07)setState("Speaking…","Cedar voice · private session");else if(lv>.06)setState("Listening…","Speak naturally; you can interrupt.");else setState("Connected","I’m here.")}
  raf=requestAnimationFrame(meter)
}
async function analyserFor(stream){
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();
  const src=audioCtx.createMediaStreamSource(stream),an=audioCtx.createAnalyser();an.fftSize=256;src.connect(an);return an
}
async function waitIce(peer){
  if(peer.iceGatheringState==="complete")return;
  await new Promise(r=>{const f=()=>{if(peer.iceGatheringState==="complete"){peer.removeEventListener("icegatheringstatechange",f);r()}};peer.addEventListener("icegatheringstatechange",f);setTimeout(r,1800)})
}
async function startVoice(){
  clearMicHelp();start.disabled=true;setState("Starting private voice…","Requesting microphone and secure voice session.");
  try{
    const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Please sign in to MatchApp Ai first.");
    if(!navigator.mediaDevices?.getUserMedia){const x=new Error("Microphone is unavailable in this browser.");x.name="NotAllowedError";throw x}
    localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    localAnalyser=await analyserFor(localStream);
    pc=new RTCPeerConnection();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
    remoteAudio=new Audio();remoteAudio.autoplay=true;
    pc.ontrack=async e=>{remoteAudio.srcObject=e.streams[0];await remoteAudio.play().catch(()=>{});remoteAnalyser=await analyserFor(e.streams[0])};
    const dc=pc.createDataChannel("oai-events");
    dc.onopen=()=>{try{dc.send(JSON.stringify({type:"response.create",response:{instructions:"Greet Jonas in one short, warm sentence and then wait for him to speak."}}))}catch{}};
    dc.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==="error")setState("Voice hiccup","The session returned an error. End and try again.",true)}catch{}};
    pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected"){end.disabled=false;end.classList.add("live");meter()}else if(["failed","closed","disconnected"].includes(pc.connectionState)){stopVoice()}};
    const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitIce(pc);
    const res=await fetch(SUPABASE_URL+"/functions/v1/private-voice-call",{method:"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({sdp:pc.localDescription.sdp})});
    const answer=await res.text();if(!res.ok)throw new Error(res.status===403?"This MatchApp account is not authorized for the private prototype.":"Voice session could not start.");
    await pc.setRemoteDescription({type:"answer",sdp:answer});end.disabled=false;end.classList.add("live");
  }catch(e){if(e?.name==="NotAllowedError"||e?.name==="SecurityError"){showMicHelp("The browser denied microphone access. This often happens inside an in-app browser.");}else{setState("Couldn’t start",e?.message||"Private voice failed to start.",true);start.disabled=false}stopMedia()}
}
function stopMedia(){if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}if(remoteAudio){remoteAudio.pause();remoteAudio.srcObject=null;remoteAudio=null}}
function stopVoice(){if(raf)cancelAnimationFrame(raf);raf=0;stopMedia();if(pc){try{pc.close()}catch{}pc=null}remoteAnalyser=localAnalyser=null;end.disabled=true;end.classList.remove("live");start.disabled=false;document.documentElement.style.setProperty("--level",".04");setState("Private access ready","Tap start when you want to talk.")}
start.addEventListener("click",startVoice);end.addEventListener("click",stopVoice);window.addEventListener("pagehide",stopMedia);authReady();
</script></main></body></html>
