<main class="card">

    <h1 id="head">Set a new password</h1>
    <p class="sub" id="sub">Choose something you'll remember. At least 8 characters.</p>

    <div id="form-area">
        <label for="pw1">New password</label>
        <input type="password" id="pw1" autocomplete="new-password" placeholder="At least 8 characters">

        <label for="pw2">Confirm new password</label>
        <input type="password" id="pw2" autocomplete="new-password" placeholder="Type it again">

        <button id="save" onclick="savePassword()">Save new password</button>
    </div>

    <p id="msg" class="msg"></p>
    <p class="hint">Didn't mean to do this? <a href="/">Go back to MatchApp</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://zkymvqrmbabngsqblyye.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpreW12cXJtYmFibmdzcWJseXllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDUyNDIsImV4cCI6MjEwMjM4MTI0Mn0._yEVFMfwVU6GBqQ8m3ljfOgA0HSLEDiKMOfYae6ZD8Q";

let client = null;
try { client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true } }); } catch (e) {}

function show(text, ok) {
    const m = document.getElementById('msg');
    m.className = 'msg ' + (ok ? 'ok' : 'bad');
    m.textContent = text;
}

// Supabase puts the recovery token in the URL fragment and, with
// detectSessionInUrl, exchanges it for a temporary session automatically.
// If there's no valid session the link is stale or already used — say so
// plainly rather than letting someone type a new password into a form that
// was always going to fail on submit.
(async function checkLink() {
    if (!client) { show('Could not connect. Please refresh and try again.', false); return; }
    const hasRecovery = window.location.hash.includes('type=recovery') || window.location.hash.includes('access_token');

    // Give Supabase a moment to process the fragment before checking.
    await new Promise(r => setTimeout(r, 400));
    const { data } = await client.auth.getSession();

    if (!data || !data.session) {
        document.getElementById('form-area').style.display = 'none';
        document.getElementById('head').textContent = 'This link has expired';
        document.getElementById('sub').textContent = hasRecovery
            ? 'Reset links are single-use and expire after a short while. Request a fresh one and it will work.'
            : 'Open the link from your reset email to get here.';
        show('Go back to MatchApp, tap Log In, then "Forgot your password?" to request a new link.', false);
    }
})();

window.savePassword = async function() {
    const p1 = document.getElementById('pw1').value;
    const p2 = document.getElementById('pw2').value;
    const btn = document.getElementById('save');

    if (p1.length < 8) { show('Password must be at least 8 characters.', false); return; }
    if (p1 !== p2)     { show("Those two passwords don't match.", false); return; }
    if (!client)       { show('Could not connect. Please refresh and try again.', false); return; }

    btn.disabled = true; const original = btn.textContent; btn.textContent = 'Saving…';

    try {
        const { error } = await client.auth.updateUser({ password: p1 });
        if (error) {
            show(error.message || 'Could not update the password. The link may have expired.', false);
            btn.disabled = false; btn.textContent = original;
            return;
        }
        document.getElementById('form-area').style.display = 'none';
        document.getElementById('head').textContent = 'Password updated';
        document.getElementById('sub').textContent = 'You can log in with your new password now.';
        show('All set — taking you back to MatchApp…', true);
        if (window.dataLayer) window.dataLayer.push({ event: 'password_reset_completed' });
        setTimeout(() => { window.location.href = '/index.html?openAuth=1'; }, 2200);
    } catch (e) {
        show('Something went wrong. Please request a new reset link.', false);
        btn.disabled = false; btn.textContent = original;
    }
};

// Enter submits, since people expect that on a two-field form.
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.getElementById('form-area').style.display !== 'none') savePassword();
});
</script>
