<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
<title id="t">MatchApp animated play emblem</title>
<desc id="d">Gold and blue circular MatchApp play emblem with five colorful orbiting stars.</desc>
<defs>
  <radialGradient id="bg" cx="42%" cy="32%" r="74%">
    <stop offset="0" stop-color="#16345f"/>
    <stop offset=".58" stop-color="#08172f"/>
    <stop offset="1" stop-color="#030815"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff2bd"/>
    <stop offset=".26" stop-color="#ffd95f"/>
    <stop offset=".58" stop-color="#d9a129"/>
    <stop offset=".82" stop-color="#fff0a7"/>
    <stop offset="1" stop-color="#9f6d12"/>
  </linearGradient>
  <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#69eaff"/>
    <stop offset=".35" stop-color="#57a7ff"/>
    <stop offset=".62" stop-color="#b755ff"/>
    <stop offset=".82" stop-color="#ff4fb1"/>
    <stop offset="1" stop-color="#ffbd3f"/>
  </linearGradient>
  <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blueGlow" x="-35%" y="-35%" width="170%" height="170%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="starGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .orbit-stars{transform-origin:256px 256px;animation:orbit 9.5s linear infinite}
  .star{transform-box:fill-box;transform-origin:center;animation:twinkle 1.9s ease-in-out infinite}
  .s2{animation-delay:.35s}.s3{animation-delay:.7s}.s4{animation-delay:1.05s}.s5{animation-delay:1.4s}
  @keyframes orbit{to{transform:rotate(360deg)}}
  @keyframes twinkle{0%,100%{opacity:.58;transform:scale(.78)}50%{opacity:1;transform:scale(1.18)}}
  @media (prefers-reduced-motion:reduce){.orbit-stars,.star{animation:none}}
</style>
<circle cx="256" cy="256" r="236" fill="url(#bg)" opacity=".98"/>
<circle cx="256" cy="256" r="215" fill="none" stroke="url(#gold)" stroke-width="4" filter="url(#goldGlow)"/>
<circle cx="256" cy="256" r="172" fill="none" stroke="#20a8ff" stroke-width="4" filter="url(#blueGlow)" opacity=".96"/>
<circle cx="256" cy="256" r="132" fill="url(#bg)" stroke="url(#gold)" stroke-width="20" filter="url(#goldGlow)"/>
<circle cx="256" cy="256" r="78" fill="#06101f" stroke="url(#gold)" stroke-width="15"/>
<path d="M226 204 L226 308 L336 256 Z" fill="url(#gold)" stroke="#fff0ae" stroke-width="5" stroke-linejoin="round" filter="url(#goldGlow)"/>
<path d="M249 226 L249 286 L313 256 Z" fill="url(#play)" opacity=".98"/>
<g class="orbit-stars" filter="url(#starGlow)">
  <path class="star s1" d="M256 36 l7 14 14 7-14 7-7 14-7-14-14-7 14-7z" fill="#ffd95f"/>
  <path class="star s2" d="M444 126 l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#65e9ff"/>
  <path class="star s3" d="M462 330 l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#ff5ebc"/>
  <path class="star s4" d="M256 456 l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#8dff72"/>
  <path class="star s5" d="M54 330 l6 12 12 6-12 6-6 12-6-12-12-6 12-6z" fill="#b982ff"/>
</g>
</svg>