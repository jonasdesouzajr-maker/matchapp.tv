  <linearGradient id="gold" x1="160" y1="130" x2="860" y2="900"><stop stop-color="#fff2a5"/><stop offset=".18" stop-color="#ffd64d"/><stop offset=".52" stop-color="#f6b914"/><stop offset=".76" stop-color="#ffef83"/><stop offset="1" stop-color="#c67a08"/></linearGradient>
  <linearGradient id="play" x1="420" y1="380" x2="650" y2="650"><stop stop-color="#8ff6ff"/><stop offset=".28" stop-color="#21c7ff"/><stop offset=".56" stop-color="#786bff"/><stop offset=".78" stop-color="#ff45c7"/><stop offset="1" stop-color="#ff9a3d"/></linearGradient>
  <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0.98 0 0.76 0 0 0.62 0 0 0.15 0 0 0 0 .9 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
