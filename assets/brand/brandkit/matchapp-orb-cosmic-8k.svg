<svg xmlns="http://www.w3.org/2000/svg" width="8192" height="8192" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="t d">
<title id="t">MatchApp TV Ai cosmic play emblem</title><desc id="d">Premium gold and electric-blue concentric play emblem with colorful orbiting stars.</desc>
<defs>
