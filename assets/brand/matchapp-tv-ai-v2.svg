<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 104" width="600" height="104" role="img" aria-label="MatchApp TV Ai">
  <title>MatchApp TV Ai</title>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7d4"/>
      <stop offset=".34" stop-color="#e5c158"/>
      <stop offset=".56" stop-color="#fff2a3"/>
      <stop offset=".82" stop-color="#b990ff"/>
      <stop offset="1" stop-color="#f2e8ff"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ff7e8"><animate attributeName="stop-color" values="#7ff7e8;#9dd6ff;#cf98ff;#ffd76c;#7ff7e8" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#cf98ff"><animate attributeName="stop-color" values="#cf98ff;#ffd76c;#7ff7e8;#9dd6ff;#cf98ff" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ffd76c"><animate attributeName="stop-color" values="#ffd76c;#7ff7e8;#9dd6ff;#cf98ff;#ffd76c" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-60%" width="170%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <text x="5" y="76" fill="url(#core)" font-family="Arial Rounded MT Bold,Trebuchet MS,Segoe UI Rounded,Arial,sans-serif" font-size="76" font-weight="900" letter-spacing="-5">MatchApp</text>

  <g transform="translate(382 17)">
    <text x="0" y="55" fill="#ffffff" font-family="Arial Rounded MT Bold,Trebuchet MS,Arial,sans-serif" font-size="48" font-weight="900" letter-spacing="0">TV
      <animate attributeName="opacity" values="1;.88;1" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <g filter="url(#softGlow)">
    <text x="476" y="73" fill="url(#ai)" font-family="Trebuchet MS,Arial Black,Arial,sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="-4">Ai</text>
    <g transform="translate(570 25)">
      <path d="M0 -9 2.7 -2.7 9 0 2.7 2.7 0 9 -2.7 2.7 -9 0 -2.7 -2.7Z" fill="#8ff7e9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".72;1;.72" dur="1.35s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
