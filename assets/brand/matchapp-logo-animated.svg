<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid slice">
<title id="title">MatchApp TV Ai</title>
<desc id="desc">Animated full-circle MatchApp gold play emblem with orbiting light trails, shine and stars.</desc>
<defs>
  <radialGradient id="disc" cx="45%" cy="38%" r="78%">
    <stop offset="0" stop-color="#261704"/>
    <stop offset=".52" stop-color="#120b02"/>
    <stop offset="1" stop-color="#050301"/>
  </radialGradient>
  <linearGradient id="gold" x1="34" y1="18" x2="224" y2="238" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fffce5"/>
    <stop offset=".13" stop-color="#fff1a0"/>
    <stop offset=".4" stop-color="#f3bd39"/>
    <stop offset=".63" stop-color="#c67c0d"/>
    <stop offset=".82" stop-color="#ffe16c"/>
    <stop offset="1" stop-color="#8e4f05"/>
  </linearGradient>
  <linearGradient id="playGold" x1="54" y1="45" x2="204" y2="202" gradientUnits="userSpaceOnUse">
    <stop stop-color="#ffffff"/>
    <stop offset=".18" stop-color="#fff8c8"/>
    <stop offset=".48" stop-color="#ffd75c"/>
    <stop offset=".78" stop-color="#d98b11"/>
    <stop offset="1" stop-color="#fff0a0"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="starGlow" x="-180%" y="-180%" width="460%" height="460%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="round"><circle cx="128" cy="128" r="128"/></clipPath>
  <style>
    .orbit-a{transform-origin:128px 128px;animation:orbitA 10s linear infinite}
    .orbit-b{transform-origin:128px 128px;animation:orbitB 15s linear infinite reverse}
    .sheen{transform-origin:128px 128px;animation:sheen 5.8s linear infinite}
    .play{animation:playPulse 3.4s ease-in-out infinite}
    .star{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
    .s2{animation-delay:-.55s}.s3{animation-delay:-1.1s}.s4{animation-delay:-.25s}
    @keyframes orbitA{to{transform:rotate(360deg)}}
    @keyframes orbitB{to{transform:rotate(360deg)}}
    @keyframes sheen{to{transform:rotate(360deg)}}
    @keyframes playPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,218,85,.45))}50%{filter:drop-shadow(0 0 12px rgba(255,226,108,.96))}}
    @keyframes twinkle{0%,100%{opacity:.48;transform:scale(.72)}50%{opacity:1;transform:scale(1.22)}}
    @media(prefers-reduced-motion:reduce){.orbit-a,.orbit-b,.sheen,.play,.star{animation:none!important}}
  </style>
</defs>

<g clip-path="url(#round)">
  <!-- The dark disc itself reaches the canvas edge. No unused square or dark annulus outside the emblem. -->
  <circle cx="128" cy="128" r="128" fill="url(#disc)"/>
  <circle cx="128" cy="128" r="124.5" fill="none" stroke="url(#gold)" stroke-width="7" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#fff2a6" stroke-opacity=".58" stroke-width="1.8"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="#bb700c" stroke-opacity=".82" stroke-width="1.5"/>

  <!-- Oversized orbit trails deliberately run almost edge-to-edge. -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="128" cy="119" rx="112" ry="68" transform="rotate(-18 128 119)" stroke="url(#gold)" stroke-width="6" opacity=".98" filter="url(#glow)"/>
    <ellipse cx="128" cy="119" rx="108" ry="62" transform="rotate(24 128 119)" stroke="#f5bd35" stroke-width="2.6" opacity=".78"/>
    <ellipse cx="128" cy="122" rx="104" ry="50" transform="rotate(-34 128 122)" stroke="#fff0a0" stroke-width="1.7" opacity=".64"/>
  </g>

  <!-- Moving highlight wraps the outside rim. -->
  <g class="sheen">
    <circle cx="128" cy="128" r="122" fill="none" stroke="#fff9d9" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="35 732" filter="url(#glow)"/>
  </g>

  <!-- The play mark is intentionally large enough to dominate the full badge. -->
  <g class="play">
    <path d="M76 57 201 122c5.5 2.9 5.5 10.8 0 13.8L76 201c-6.8 3.5-14.8-1.4-14.8-9V66c0-7.6 8-12.5 14.8-9Z"
          fill="none" stroke="url(#playGold)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M72 63 190 124" fill="none" stroke="#fffdeb" stroke-opacity=".82" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Two independent star systems circle the full badge. -->
  <g class="orbit-a" fill="#fff8c7" filter="url(#starGlow)">
    <g class="star" transform="translate(128 8)"><path d="M0-12 2.4-2.4 12 0 2.4 2.4 0 12-2.4 2.4-12 0-2.4-2.4Z"/></g>
    <circle cx="205" cy="31" r="2.8"/>
    <circle cx="239" cy="122" r="2.2"/>
    <circle cx="199" cy="222" r="2.4"/>
    <circle cx="53" cy="216" r="2"/>
  </g>
  <g class="orbit-b" fill="#ffd55f" filter="url(#starGlow)">
    <g class="star s2" transform="translate(22 91)"><path d="M0-9 1.8-1.8 9 0 1.8 1.8 0 9-1.8 1.8-9 0-1.8-1.8Z"/></g>
    <g class="star s3" transform="translate(224 170)"><path d="M0-7 1.45-1.45 7 0 1.45 1.45 0 7-1.45 1.45-7 0-1.45-1.45Z"/></g>
    <circle cx="89" cy="17" r="1.9"/>
    <circle cx="26" cy="168" r="1.8"/>
    <circle cx="155" cy="238" r="2"/>
  </g>

  <!-- Fixed cinematic flare points. -->
  <g fill="#fffbe4" filter="url(#starGlow)">
    <g class="star s4" transform="translate(199 72)"><path d="M0-14 2.5-2.5 14 0 2.5 2.5 0 14-2.5 2.5-14 0-2.5-2.5Z"/></g>
    <g class="star s2" transform="translate(48 130)"><path d="M0-9 1.7-1.7 9 0 1.7 1.7 0 9-1.7 1.7-9 0-1.7-1.7Z"/></g>
  </g>

  <text x="128" y="226" text-anchor="middle" fill="url(#playGold)"
        font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing=".35"
        filter="url(#glow)">MatchApp Ai</text>
</g>
</svg>