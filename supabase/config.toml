# Supabase local/CLI configuration.
#
# The stripe-webhook function MUST have JWT verification disabled: Stripe
# signs its requests with its own signature scheme and cannot send a Supabase
# JWT. Security for that endpoint comes from Stripe signature verification
# inside the function itself, not from Supabase auth.
#
# If you deploy via the Dashboard instead of the CLI, untick
# "Verify JWT with legacy secret" on the stripe-webhook function — otherwise
# every Stripe delivery is rejected with 401 before your code ever runs.

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = true

[functions.gemini-proxy]
verify_jwt = true

[functions.tmdb-proxy]
verify_jwt = true

# Backend-only hourly notification delivery. It validates a secret stored in Supabase Vault.
[functions.notification-worker]
verify_jwt = false

# catalog-media-ingest is backend-only. Supabase's JWT gate is disabled because
# the endpoint validates GitHub Actions' short-lived OIDC JWT itself before any
# TMDB request or database write.
[functions.catalog-media-ingest]
verify_jwt = false

# Hosted projects also need these settings enabled in Authentication > Passkeys.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "MatchApp.tv"
rp_id = "matchapp.tv"
rp_origins = ["https://matchapp.tv", "https://www.matchapp.tv"]
