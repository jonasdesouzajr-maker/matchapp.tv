<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14131a">
  <title>Confirm your email | MatchApp Ai</title>
  <link rel="icon" href="/logo.jpeg" type="image/jpeg">
  <style>
    :root { color-scheme: dark; --gold: #e5c158; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: radial-gradient(circle at 50% 0%, #30204b 0%, #14131a 62%);
      color: #fff; display: grid; place-items: center; padding: 20px; font: 16px/1.55 system-ui, sans-serif; }
    main { width: min(100%, 470px); padding: clamp(24px, 6vw, 38px); border: 1px solid #b8912f;
      border-radius: 22px; background: rgba(20,19,26,.97); text-align: center; box-shadow: 0 20px 60px #0009; }
    .brand { display: block; margin: 0 auto 24px; width: min(82%, 285px); height: auto; }
    h1 { color: var(--gold); font-size: clamp(23px, 5vw, 29px); margin: 0 0 10px; }
    p { color: #e2daee; margin: 0 0 25px; }
    button { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 13px;
      font: 800 16px/1.2 system-ui, sans-serif; background: linear-gradient(125deg,#d2a640,#fff0a6,#ba8b24);
      color: #1d1329; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    a { display: inline-block; color: #f2d37b; margin-top: 22px; text-underline-offset: 3px; }
    #confirmation-status { min-height: 48px; margin-top: 18px; margin-bottom: 0; font-size: 14px; }
    #confirmation-status[data-state="error"] { color: #ffb4b4; }
    #confirmation-status[data-state="success"] { color: #9beeb8; }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/assets/brand/matchapp-tv-ai-v2.svg" alt="MatchApp Ai" width="285" height="52">
    <h1>Confirm your email</h1>
    <p>For your security, we will verify your address only when you choose the button below.</p>
    <button id="confirm-email" type="button">Confirm my email</button>
    <p id="confirmation-status" role="status" aria-live="polite"></p>
    <a href="/?signIn=1">Sign in or request a new confirmation email</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
  <script src="/auth-confirmation-page.js?v=20260926-manualverify1"></script>
</body>
</html>
