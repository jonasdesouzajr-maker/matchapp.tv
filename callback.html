    <script>
        // Supabase automatically parses the URL hash in app.js. We just wait and redirect.
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(async () => {
                if (window.supabaseClient) {
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session) {
                        window.location.href = 'index.html';
                    } else {
                        // If it fails, send them back so they can try again.
                        window.location.href = 'index.html'; 
                    }
                } else {
                    // BUG FIXED: this branch didn't exist before. If Supabase's
                    // client never initialised (slow network, ad blocker,
                    // script failure), nothing here ever fired, and the visible
                    // link above was the ONLY way out — someone could otherwise
                    // sit on this screen indefinitely. Now it degrades the same
                    // way the other two outcomes already do: back to the
                    // homepage, where they can simply try signing in again.
                    window.location.href = 'index.html';
                }
            }, 2500); // Gives the aesthetic loading screen 2.5 seconds to shine
        });
    </script>
