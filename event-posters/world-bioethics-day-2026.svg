 <path d="M523 477 L679 477 M550 459 L650 459" stroke="url(#gold)" stroke-width="12"/>
 <path d="M367 267 Q600 225 833 267" stroke="url(#gold)" stroke-width="11" fill="none"/>
 <circle cx="600" cy="240" r="23" fill="#EBD09A" stroke="#FFF1C7" stroke-width="6"/>
 <circle cx="367" cy="267" r="9" fill="#F2D8A9"/><circle cx="833" cy="267" r="9" fill="#F2D8A9"/>
 <path d="M368 267 L317 396 M368 267 L419 396 M832 267 L781 396 M832 267 L883 396" stroke="#E8C792" stroke-width="4" fill="none"/>
 <path d="M301 401 Q367 439 435 401 Q423 451 367 462 Q314 450 301 401 Z" fill="url(#glass)" stroke="url(#gold)" stroke-width="5"/>
 <path d="M765 401 Q833 439 899 401 Q886 451 834 462 Q778 450 765 401 Z" fill="url(#glass)" stroke="url(#gold)" stroke-width="5"/>
</g>
<!-- Science: intertwining DNA strands rising from the left pan -->
<g fill="none" stroke-linecap="round" transform="translate(0 -5)">
 <path d="M337 366 C386 347 347 326 397 304 C353 289 375 268 405 257" stroke="#8DE2CE" stroke-width="8"/>
 <path d="M395 367 C347 349 382 325 333 303 C377 285 358 269 330 255" stroke="#C6A5F6" stroke-width="8"/>
