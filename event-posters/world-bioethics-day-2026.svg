</g>
<g fill="#A4E2DB" opacity=".45"><circle cx="74" cy="152" r="4"/><circle cx="174" cy="110" r="4"/><circle cx="273" cy="150" r="4"/><circle cx="323" cy="87" r="4"/><circle cx="925" cy="112" r="4"/><circle cx="1013" cy="83" r="4"/><circle cx="1111" cy="155" r="4"/><circle cx="163" cy="460" r="4"/><circle cx="1032" cy="451" r="4"/></g>
