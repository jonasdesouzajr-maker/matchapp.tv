 <path d="M174 -20 Q88 -55 5 -17 L0 26 Q79 -10 174 24 Z" fill="#D4E3D8"/>
 <path d="M0 -15 L0 45 M-151 -7 Q-76 -30 -24 -10 M-151 12 Q-90 -6 -24 11 M23 -11 Q91 -31 151 -7 M23 12 Q94 -6 151 12" fill="none" stroke="#7BABA6" stroke-width="3" opacity=".7"/>
</g>
<!-- Ethical balance: a real justice-scale illustration, not a placeholder -->
<g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
