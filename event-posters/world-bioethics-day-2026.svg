<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">World Bioethics Day 2026 – knowledge, compassion and justice</title>
<desc id="desc">Original editorial illustration of balanced scales holding a DNA double helix and a caring human figure, with a luminous connected globe and an open book, for World Bioethics Day, October 19.</desc>
<defs>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#130F28"/><stop offset=".6" stop-color="#152D3B"/><stop offset="1" stop-color="#102B2C"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#8ADBC4" stop-opacity=".38"/><stop offset="1" stop-color="#8ADBC4" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFF0BF"/><stop offset=".45" stop-color="#EAC27B"/><stop offset="1" stop-color="#AC7043"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#95E5CE"/><stop offset="1" stop-color="#398C99"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#A9DBDB" stop-opacity=".22"/><stop offset="1" stop-color="#A9DBDB" stop-opacity=".02"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.6"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#050A1C" flood-opacity=".55"/></filter>
</defs>
<rect width="1200" height="750" fill="url(#back)"/>
<circle cx="610" cy="258" r="358" fill="url(#aura)"/>
<circle cx="610" cy="260" r="260" stroke="#9BD9C4" stroke-opacity=".12" stroke-width="2" fill="none"/>
<circle cx="610" cy="260" r="205" stroke="#E0C18E" stroke-opacity=".16" stroke-width="2" fill="none" stroke-dasharray="4 18"/>
<g stroke="#97CFCF" stroke-opacity=".17" stroke-width="2" fill="none">
