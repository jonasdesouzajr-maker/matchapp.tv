<g filter="url(#shadow)" transform="translate(600 495)">
 <path d="M-178 -15 Q-100 -43 -12 -9 L0 7 Q82 -45 177 -16 L177 37 Q80 5 0 44 Q-80 7 -177 37 Z" fill="#193C49" stroke="#C5D9CE" stroke-width="4"/>
