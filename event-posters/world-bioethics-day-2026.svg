 <path d="M-53 52 C-50 3 -30 -1 0 -1 C30 -1 50 3 53 52" fill="#579BAB" stroke="#B5E6D9" stroke-width="5"/>
 <path d="M-23 29 C-28 17 -6 6 0 19 C7 6 28 17 23 29 Q16 45 0 54 Q-16 45 -23 29 Z" fill="#F5C394" stroke="#FFE5BD" stroke-width="3"/>
</g>
<!-- Moral imagination: glowing orbit, balanced symmetrically around the scales -->
<g fill="none"><ellipse cx="600" cy="268" rx="335" ry="127" transform="rotate(-13 600 268)" stroke="#72B9AE" stroke-opacity=".25" stroke-width="2"/><ellipse cx="600" cy="268" rx="335" ry="127" transform="rotate(13 600 268)" stroke="#D6B47F" stroke-opacity=".18" stroke-width="2"/></g>
<g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="600" y="611" fill="#F6EBCF" font-size="53" font-weight="750" letter-spacing="5">WORLD BIOETHICS DAY</text>
 <text x="600" y="652" fill="#B9DED9" font-size="20" font-weight="650" letter-spacing="6">19 OCTOBER 2026</text>
 <path d="M441 680 L759 680" stroke="#B8A47A" stroke-opacity=".55" stroke-width="2"/>
 <text x="600" y="708" fill="#E0C999" font-size="17" letter-spacing="4">SCIENCE  ·  DIGNITY  ·  CARE</text>
