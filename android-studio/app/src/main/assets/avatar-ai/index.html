<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090712">
<title>MatchApp Ai · Android Avatar</title>
<style>
:root{color-scheme:dark;--gold:#edc969;--violet:#885cff;--text:#f8f6ff;--sub:#beb7d1;--volume:0}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:500 15px/1.5 Inter,system-ui,Roboto,sans-serif;color:var(--text);background:radial-gradient(ellipse 90% 52% at 50% 30%,#2b174a 0%,#100a20 52%,#07060e 100%)}button{font:inherit;touch-action:manipulation}
.shell{min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));max-width:570px;margin:auto;position:relative;isolation:isolate}
.ambient{pointer-events:none;position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 52%,rgba(153,99,255,.15),transparent 50%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{width:43px;height:43px;display:grid;place-items:center;color:#f7f1ff;background:rgba(255,255,255,.04);border:1px solid rgba(224,190,112,.25);border-radius:50%;font-size:21px}
.brand{flex:1;text-align:center;line-height:1.2;font-size:17px;font-weight:800;letter-spacing:-.01em}.brand em{font-style:normal;color:var(--gold)}.brand small{display:block;color:var(--sub);font-size:10px;font-weight:650;letter-spacing:.17em;margin-top:5px;text-transform:uppercase}
.privacy{font-size:10px;white-space:nowrap;color:#eacb80;background:rgba(236,194,97,.08);padding:8px 10px;border:1px solid rgba(236,194,97,.22);border-radius:99px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.portrait-wrap{width:min(72vw,46dvh,280px);aspect-ratio:1;position:relative;border-radius:50%;filter:drop-shadow(0 18px 28px rgba(0,0,0,.42))}
.portrait-wrap:before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(237,201,105,.78);box-shadow:0 0 28px rgba(155,99,255,.28),inset 0 0 12px rgba(236,196,102,.12);pointer-events:none;z-index:2;transition:box-shadow .35s}
body[data-mode="speaking"] .portrait-wrap:before{box-shadow:0 0 calc(25px + var(--volume)*65px) rgba(163,116,255,.5),inset 0 0 12px rgba(236,196,102,.18)}
.face{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;object-position:center 22%;background:#1b1626}
.glimmer{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(251,218,154,.10),transparent 35%,transparent 66%,rgba(132,93,222,.14));mix-blend-mode:screen}
.status-dot{position:absolute;right:3%;bottom:9%;width:15px;height:15px;border-radius:50%;border:3px solid #130d22;background:#8c809d;z-index:3}body[data-mode="connected"] .status-dot,body[data-mode="listening"] .status-dot,body[data-mode="speaking"] .status-dot{background:#66efb0;box-shadow:0 0 17px rgba(95,235,183,.8)}
.status{text-align:center;padding-top:9px}.status h1{margin:0;font-size:clamp(20px,3dvh,26px);line-height:1.2;font-weight:820;letter-spacing:-.03em}.status p{color:var(--sub);font-size:12px;margin:7px auto;max-width:320px;min-height:30px}
.wave{display:flex;align-items:center;justify-content:center;height:44px;gap:4px}.wave span{background:linear-gradient(180deg,#efcd82,#9a7ff2);width:3.5px;height:10px;border-radius:8px;transform-origin:center;transition:transform 65ms ease-out}
.actions{padding:0 0 4px;display:grid;gap:13px}.main-btn{width:100%;min-height:56px;border-radius:999px;border:0;background:linear-gradient(107deg,#a98af3,#e4bb69 92%);color:#1a1124;font-weight:850;font-size:15px;box-shadow:0 12px 32px rgba(151,105,244,.16)}.main-btn:disabled{opacity:.55}.main-btn.end{background:rgba(234,116,138,.10);border:1px solid rgba(246,147,155,.46);color:#f9d0d1;box-shadow:none}
.secondary{width:100%;min-height:43px;background:transparent;color:#ddd2f3;border:1px solid rgba(220,207,244,.19);border-radius:999px;font-size:12px}.secondary[hidden]{display:none}
.foot{text-align:center;font-size:10px;color:#8e849e;margin-top:4px}.foot strong{color:#d5bf85}
@media(min-width:700px){.shell{padding-top:27px;padding-bottom:25px}.portrait-wrap{width:min(34vw,280px)}}
@media(max-height:710px){.stage{gap:4px}.portrait-wrap{width:min(52vw,34dvh)}.status p{margin:4px auto}.status h1{font-size:19px}.wave{height:33px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><link rel="stylesheet" href="/brand.css?v=195">
</head>
<body data-mode="ready">
<div class="matchapp-brand-bar"><a class="matchapp-brand-link" href="/" aria-label="MatchApp Ai"><img class="matchapp-wordmark" src="/assets/brand/matchapp-tv-ai-v2.svg" alt="MatchApp Ai" width="600" height="104" decoding="async"></a></div>

<div class="shell"><div class="ambient"></div>
<header class="top"><button id="back" class="back" aria-label="Return to MatchApp Ai">‹</button><div class="brand">MatchApp <em>Ai</em><small id="avatar-subtitle">Voice avatar · Android</small></div><span class="privacy">● Beta</span></header>
<main class="stage"><div class="portrait-wrap"><canvas id="face" class="face" aria-label="AI avatar portrait"></canvas><div class="glimmer"></div><div class="status-dot"></div></div>
<div class="status" role="status" aria-live="polite"><h1 id="title">Ready to talk</h1><p id="description">Natural voice, with subtle real-time facial movement.</p></div>
<div class="wave" id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></main>
<footer class="actions"><button id="primary" class="main-btn">Start conversation</button><button id="secondary" class="secondary" hidden>Mute microphone</button><div class="foot"><strong>MatchApp Ai</strong> · Voice powered by OpenAI Realtime<br>Face movement is audio-reactive, not phoneme-accurate lip-sync.</div></footer>
</div>
<script>
"use strict";
// All markup, UI and identity artwork are bundled inside the Android application.
// No internet-hosted avatar renderer, external JS package or browser page is used.
const $ = id => document.getElementById(id);
const face=$("face"),canvas=face.getContext("2d",{alpha:false}),img=new Image();img.src="created-avatar.jpg";
let persona="jonas",initialPrompt="";
const wave=[...$("wave").children];let jwt="",pc=null,dc=null,mic=null,audio=null,ctx=null,inMeter=null,outMeter=null,frame=0,mode="ready",muted=false,connectingTimer=0;
let mouth=0,speech=0,blinkAt=performance.now()+3100,blink=0,blinkStart=-2000,prevTime=0,missingImage=false;
let visemes=[],currentViseme="a",lastVisemeAt=0;
const minimal=matchMedia("(prefers-reduced-motion:reduce)").matches;
const sessionReady=new Promise(resolve=>{window.MatchAppAvatar={init:(token,selected,question)=>{
 jwt=String(token||"");persona="jonas";initialPrompt=String(question||"").slice(0,1000);
 img.src="created-avatar.jpg";
 const name="Jonas";$("avatar-subtitle").textContent=name+" · Voice avatar";face.setAttribute("aria-label",name+" AI avatar portrait");
 resolve(jwt);
}};setTimeout(()=>resolve(jwt),5000)});
const setStatus=(state,title,description)=>{
  mode=state;document.body.dataset.mode=state;$("title").textContent=title;$("description").textContent=description;
  const live=["connected","listening","speaking"].includes(state);
  $("primary").textContent=live?"End conversation":state==="connecting"?"Connecting…":state==="error"?"Try again":"Start conversation";
  $("primary").classList.toggle("end",live);$("primary").disabled=state==="connecting";
  $("secondary").hidden=!live;$("secondary").textContent=muted?"Unmute microphone":"Mute microphone";
};
function analyser(stream){if(!ctx||!stream)return null;const a=ctx.createAnalyser();a.fftSize=256;ctx.createMediaStreamSource(stream).connect(a);return a}
function amplitude(a){if(!a)return 0;let sum=0;const v=new Uint8Array(a.fftSize);a.getByteTimeDomainData(v);for(let i=0;i<v.length;i++){const d=(v[i]-128)/128;sum+=d*d}return Math.sqrt(sum/v.length)}
function faceFrame(t){
 if(!img.complete||!img.naturalWidth){if(!missingImage){canvas.fillStyle="#23172f";canvas.fillRect(0,0,face.width,face.height)}return}
 const w=face.width,h=face.height,iw=img.naturalWidth,ih=img.naturalHeight;
 canvas.clearRect(0,0,w,h);
 canvas.save();
 canvas.beginPath();
 canvas.arc(w/2,h/2,Math.min(w,h)/2-1,0,Math.PI*2);
 canvas.clip();
 const scale=Math.max(w/iw,h/ih)*(1+Math.max(0,mouth)*.035);
 const dw=iw*scale,dh=ih*scale;
 canvas.drawImage(img,(w-dw)/2,(h-dh)/2-h*.03,dw,dh);
 if(!minimal && blink>.08){
   canvas.fillStyle="rgba(10,7,16,"+(blink*.42)+")";
   canvas.fillRect(w*.2,h*.33,w*.6,Math.max(2,h*.055*blink));
 }
 canvas.restore();
}
function draw(t){
 const dt=Math.min(60,Math.max(0,t-prevTime||16));prevTime=t;
 const micLvl=muted?0:amplitude(inMeter)*6,voiceLvl=amplitude(outMeter)*7;
 const output=Math.min(1,voiceLvl),input=Math.min(1,micLvl);
 speech+=(output-speech)*Math.min(1,dt/120);
 mouth+=(output>0.055?output:0-mouth)*Math.min(1,dt/92);
 document.documentElement.style.setProperty("--volume",String(Math.min(1,speech)));
 const hasCall=pc&&pc.connectionState==="connected";
 if(hasCall){const next=output>.055?"speaking":input>.055?"listening":"connected";if(next!==mode){
  setStatus(next,next==="speaking"?"Speaking…":next==="listening"?"Listening…":"Connected",next==="speaking"?"Live reply · interrupt any time":next==="listening"?"Go ahead, I'm listening":"I'm here. Say anything.");}}
 if(output>.045 && t>lastVisemeAt+95){lastVisemeAt=t;currentViseme=visemes.shift()||"a"}
 if(!minimal){
  if(t>blinkAt){blinkAt=t+2600+Math.random()*3300;blinkStart=t}
  const blinkProgress=(t-blinkStart)/190;
  blink=blinkProgress>=0&&blinkProgress<=1?Math.sin(Math.PI*blinkProgress):0;
  // Tiny anchored head movement and breathing; no continuous spinning/bobbing.
  const sway=Math.sin(t/3400)*.52,breath=Math.sin(t/2300)*.004;
  face.style.transform="translateX("+sway+"px) rotate("+(sway*.25)+"deg) scale("+(1+breath)+")";
 }
 if(img.complete&&img.naturalWidth)faceFrame(t);
 wave.forEach((el,i)=>{const v=Math.min(1,output*.9+input*.4);const p=.55+(.4+.3*Math.sin(i*1.4+t/155))*(v*3);el.style.transform="scaleY("+Math.max(.48,p)+")"});
 frame=requestAnimationFrame(draw);
}
img.onload=()=>{face.width=640;face.height=640;faceFrame(0)};
img.onerror=()=>{missingImage=true;setStatus("error","Avatar portrait unavailable","Reinstall the latest Android build.");};
frame=requestAnimationFrame(draw);
async function waitForIce(peer){
 if(peer.iceGatheringState==="complete")return;
 await new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>reject(Error("Voice network negotiation timed out.")),12000);
  const done=()=>{if(peer.iceGatheringState==="complete"){clearTimeout(timer);peer.removeEventListener("icegatheringstatechange",done);resolve()}};
  peer.addEventListener("icegatheringstatechange",done);done();
 });
}
function stop(){clearTimeout(connectingTimer);connectingTimer=0;
 if(dc){try{dc.close()}catch{}dc=null}
 if(pc){try{pc.close()}catch{}pc=null}
 if(mic){mic.getTracks().forEach(t=>t.stop());mic=null}
 if(audio){audio.pause();audio.srcObject=null;audio.remove();audio=null}
 if(ctx){ctx.close().catch(()=>{});ctx=null}
 inMeter=outMeter=null;mouth=0;speech=0;muted=false;
}
async function start(){
 if(!jwt){setStatus("error","Sign in required","Sign in to MatchApp Ai in the app, then return here.");return}
 setStatus("connecting","Preparing your call…","Connecting securely to MatchApp Ai.");
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error("Microphone unavailable on this Android device.");
  mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  inMeter=analyser(mic);pc=new RTCPeerConnection();mic.getTracks().forEach(track=>pc.addTrack(track,mic));
  audio=document.createElement("audio");audio.autoplay=true;audio.playsInline=true;audio.style.display="none";document.body.appendChild(audio);
  pc.ontrack=e=>{const stream=e.streams&&e.streams[0];if(!stream)return;audio.srcObject=stream;audio.play().catch(()=>{});outMeter=analyser(stream)};
  dc=pc.createDataChannel("oai-events");
  dc.onopen=()=>{
    // Match the selected avatar with a suitable Realtime voice before first speech.
    // These are model-provided voices; the portrait is not presented as a real person.
    if(initialPrompt){
      const question=initialPrompt;initialPrompt="";
      dc.send(JSON.stringify({type:"conversation.item.create",item:{type:"message",role:"user",content:[{type:"input_text",text:question}]}}));
      dc.send(JSON.stringify({type:"response.create"}));
    }else dc.send(JSON.stringify({type:"response.create",response:{instructions:"Greet the listener in one natural sentence and invite them to speak."}}));
  };
  dc.onmessage=e=>{try{const event=JSON.parse(e.data);
   if(event.type==="response.output_audio_transcript.delta"||event.type==="response.audio_transcript.delta"){
    const chunk=String(event.delta||"").toLowerCase().replace(/[^a-zà-ÿ]/g,"");
    for(const ch of chunk){if(visemes.length<220)visemes.push(ch)}
   }
   if(event.type==="error")setStatus("error","Voice response interrupted","Retry the call if the problem continues.");
  }catch{}};
  pc.onconnectionstatechange=()=>{if(!pc)return;if(pc.connectionState==="connected"){clearTimeout(connectingTimer);setStatus("connected","Connected","I'm here. Say anything.")}
    else if(["failed","disconnected"].includes(pc.connectionState)){stop();setStatus("error","Connection ended","Check your internet connection and try again.")}};
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);await waitForIce(pc);
  const sdp=pc.localDescription&&pc.localDescription.sdp;
  if(!sdp)throw Error("Voice offer unavailable.");
  const res=await fetch("https://zkymvqrmbabngsqblyye.supabase.co/functions/v1/private-voice-call",{
   method:"POST",headers:{"Authorization":"Bearer "+jwt,"apikey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpreW12cXJtYmFibmdzcWJseXllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDUyNDIsImV4cCI6MjEwMjM4MTI0Mn0._yEVFMfwVU6GBqQ8m3ljfOgA0HSLEDiKMOfYae6ZD8Q","Content-Type":"application/json"},
   body:JSON.stringify({sdp,persona})
  });
  if(!res.ok){if(res.status===401)throw Error("Your login expired. Sign in again.");if(res.status===403)throw Error("Avatar voice beta is not enabled on this account yet.");throw Error("Voice could not connect (HTTP "+res.status+").")}
  const answer=await res.text();await pc.setRemoteDescription({type:"answer",sdp:answer});
  connectingTimer=setTimeout(()=>{if(pc&&pc.connectionState!=="connected"){stop();setStatus("error","Connection timed out","Try again with a stable internet connection.")}},17000)
 }catch(err){stop();const msg=err&&err.name==="NotAllowedError"?"Allow microphone permission in Android Settings, then try again.":String(err?.message||"Voice connection failed.");
  setStatus("error","Could not start the avatar",msg)}
}
$("primary").addEventListener("click",()=>{if(["connected","listening","speaking"].includes(mode)){stop();setStatus("ready","Call finished","You can start another conversation.");}else if(mode!=="connecting")start()});
$("secondary").addEventListener("click",()=>{if(!mic)return;muted=!muted;mic.getAudioTracks().forEach(t=>t.enabled=!muted);$("secondary").textContent=muted?"Unmute microphone":"Mute microphone"});
$("back").addEventListener("click",()=>{stop();window.location.href="matchapp-avatar://close"});
document.addEventListener("visibilitychange",()=>{if(document.hidden){stop();setStatus("ready","Call paused","Return to the app to start another conversation.")}});
window.addEventListener("pagehide",stop);
sessionReady.then(t=>{
 if(!t){setStatus("error","Sign in required","Open MatchApp Ai, sign in, then start the avatar again.");return;}
 if(initialPrompt)start();
});
</script>
