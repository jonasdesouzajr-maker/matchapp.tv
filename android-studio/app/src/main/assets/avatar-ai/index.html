<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090712">
<title>MatchApp Ai · Android Avatar</title>
<link rel="stylesheet" href="https://matchapp.tv/jonas/android-avatar/experience.css">

<link rel="stylesheet" href="/brand.css?v=195">
</head>
<body data-mode="ready">
<div class="matchapp-brand-bar"><a class="matchapp-brand-link" href="/" aria-label="MatchApp Ai"><img class="matchapp-wordmark" src="/assets/brand/matchapp-tv-ai-v2.svg" alt="MatchApp Ai" width="600" height="104" decoding="async"></a></div>

<div class="shell"><div class="ambient"></div>
<header class="top"><button id="back" class="back" aria-label="Return to MatchApp Ai">‹</button><div class="brand">MatchApp <em>Ai</em><small>Voice avatar · Android</small></div><span class="privacy">● Beta</span></header>
<main class="stage"><div class="portrait-wrap"><canvas id="face" class="face" aria-label="Jonas, created AI avatar"></canvas><div class="glimmer"></div><div class="status-dot"></div></div>
<div class="status" role="status" aria-live="polite"><h1 id="title">Ready to talk</h1><p id="description">Natural voice, with subtle real-time facial movement.</p></div>
<div class="wave" id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></main>
<footer class="actions"><button id="primary" class="main-btn">Start conversation</button><button id="secondary" class="secondary" hidden>Mute microphone</button><div class="foot"><strong>MatchApp Ai</strong> · Voice powered by OpenAI Realtime<br>Face movement is audio-reactive, not phoneme-accurate lip-sync.</div></footer>
</div>
<script>
"use strict";
// Buffer native handoff if the remotely maintained first-party script loads late.
window.__matchappAvatarPendingToken="";
window.MatchAppAvatar={init:function(token){window.__matchappAvatarPendingToken=String(token||"");}};
function matchAppAvatarLoadFailed(){
 var title=document.getElementById("title"),desc=document.getElementById("description"),button=document.getElementById("primary");
 if(title)title.textContent="Voice temporarily unavailable";
 if(desc)desc.textContent="Check your connection and reopen Jonas.";
 if(button)button.disabled=true;
}
</script>
<script src="https://matchapp.tv/jonas/android-avatar/runtime.js" defer onerror="matchAppAvatarLoadFailed()"></script>
</body></html>
